<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Login - Splash</title>
<style>
:root{--red:#f37b1d;--red-light:#ffa74f;--red-deep:#cc5a00;--gold:#ffcc00;--navy:#3d2b1f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.4;background:#fcfaf8;color:#222;width:100%;min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;overflow-x:hidden}
img{max-width:100%}

/* ---------- Splash screen ---------- */
#splashScreen{position:fixed;inset:0;background:linear-gradient(160deg,var(--red-light),var(--red-deep));z-index:99999;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .8s ease,visibility .8s ease}
#splashScreen.hide{opacity:0;visibility:hidden}
.splash-logo-wrapper{margin-bottom:14px;animation:floatPulse 2s ease-in-out infinite}
.splash-logo{width:clamp(78px,24vw,100px);aspect-ratio:1;background:#fff;border-radius:50%;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 0 30px rgba(255,255,255,.55),0 0 60px rgba(255,255,255,.28),0 8px 16px rgba(0,0,0,.2);border:3px solid #fff}
.splash-logo img{width:100%;height:100%;object-fit:cover}
@keyframes floatPulse{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-7px) scale(1.02)}}
.splash-name{color:#fff;font-size:19px;font-weight:800;font-family:Georgia,'Times New Roman',serif;letter-spacing:2px;margin-bottom:20px;text-shadow:0 2px 4px rgba(0,0,0,.2)}
.splash-bar{width:min(160px,50vw);height:5px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden;margin-bottom:10px}
.splash-fill{height:100%;width:0;background:#fff;border-radius:4px;transition:width .15s linear}
.splash-text{color:rgba(255,255,255,.9);font-size:12px;font-weight:600;letter-spacing:.5px}

/* ---------- Hero ---------- */
.auth-hero{position:relative;width:100%;height:clamp(130px,27vh,210px);overflow:hidden;flex-shrink:0;background:linear-gradient(160deg,var(--red-light),var(--red-deep))}
.auth-hero img.hero-bg{width:100%;height:100%;object-fit:cover;display:block;transition:opacity .3s ease}
.auth-hero::after{content:'';position:absolute;left:0;right:0;bottom:0;height:70px;background:linear-gradient(to top,#fcfaf8 8%,transparent);z-index:1}
.auth-logo{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:66px;height:66px;border-radius:50%;border:3px solid #fff;background:linear-gradient(160deg,var(--red-light),var(--red-deep));box-shadow:0 4px 12px rgba(0,0,0,.18);z-index:2;overflow:hidden;display:flex;align-items:center;justify-content:center}
.auth-logo img{width:100%;height:100%;object-fit:contain}

/* ---------- Card ---------- */
.auth-card{flex:1;padding:0 20px 28px;display:flex;flex-direction:column;align-items:center}
.auth-title{color:var(--red-deep);font-size:clamp(19px,5.6vw,22px);font-weight:800;margin:10px 0 14px;letter-spacing:.4px}
.auth-form{width:100%;max-width:400px;display:flex;flex-direction:column;gap:10px;animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.auth-input-group{display:flex;align-items:center;border:1.5px solid #e6dcd3;border-radius:13px;background:#fff;height:46px;overflow:hidden;transition:border-color .2s,box-shadow .2s}
.auth-input-group:focus-within{border-color:var(--red);box-shadow:0 0 0 3px rgba(243,123,29,.15)}
.auth-prefix{padding:0 12px;color:var(--red-deep);font-weight:700;font-size:14px;border-right:1px solid #eee;height:24px;display:flex;align-items:center}
.auth-input{flex:1;height:100%;border:none;outline:none;padding:0 12px;font-size:14.5px;color:#333;background:transparent;width:100%;min-width:0;font-family:inherit}
.auth-input::placeholder{color:#a8a8a8}
.auth-icon{padding:0 0 0 13px;color:#bbb;display:flex;align-items:center;justify-content:center}
.auth-icon svg,.auth-eye svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.auth-eye{cursor:pointer;padding:0 13px;color:#bbb;display:flex;align-items:center;height:100%}
.auth-eye.active{color:var(--red)}
.auth-eye .eye-on{display:none}
.auth-eye.active .eye-on{display:block}
.auth-eye.active .eye-off{display:none}
.auth-remember{display:flex;align-items:center;gap:8px;font-size:13px;color:#666;cursor:pointer;padding-left:3px}
.auth-remember input{accent-color:var(--red);width:15px;height:15px;cursor:pointer}
.auth-btn{height:46px;border-radius:26px;background:linear-gradient(180deg,var(--red-light),var(--red-deep));color:#fff;font-size:15px;font-weight:800;letter-spacing:.5px;border:none;cursor:pointer;margin-top:4px;box-shadow:0 5px 13px rgba(243,123,29,.35);transition:transform .1s;display:flex;align-items:center;justify-content:center;gap:9px;font-family:inherit}
.auth-btn:active:not(:disabled){transform:scale(.97)}
.auth-btn:disabled{opacity:.8;cursor:not-allowed}
.auth-switch{margin-top:12px;font-size:13.5px;color:#666;text-align:center}
.auth-switch a{color:var(--red-deep);font-weight:700;text-decoration:none;margin-left:4px}
.btn-spinner{width:16px;height:16px;border-radius:50%;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite;display:none}
.auth-btn.loading .btn-spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:rgba(40,28,20,.92);color:#fff;padding:9px 16px;border-radius:30px;font-size:13px;font-weight:600;z-index:100000;opacity:0;pointer-events:none;transition:opacity .25s;max-width:88%;text-align:center}
.toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

/* ---------- Popup Modal ---------- */
#rewardPopup {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.75);
  z-index: 1000000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  opacity: 0;
  visibility: hidden;
  transition: opacity 0.3s ease, visibility 0.3s ease;
}
#rewardPopup.show {
  opacity: 1;
  visibility: visible;
}
.popup-content {
  position: relative;
  width: 100%;
  max-width: 360px;
  background: transparent;
  display: flex;
  flex-direction: column;
  transform: scale(0.9) translateY(20px);
  transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
}
#rewardPopup.show .popup-content {
  transform: scale(1) translateY(0);
}
.popup-close {
  position: absolute;
  top: 12px;
  right: 12px;
  width: 32px;
  height: 32px;
  background: rgba(100, 100, 100, 0.6);
  color: #fff;
  border: none;
  border-radius: 50%;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 10;
  backdrop-filter: blur(2px);
  transition: background 0.2s, transform 0.1s;
}
.popup-close:active { transform: scale(0.9); }
.popup-img {
  width: 100%;
  display: block;
  object-fit: cover;
  border-radius: 20px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.4);
}
.popup-join-btn {
  width: 100%;
  margin: 15px 0 0;
  padding: 16px;
  background: linear-gradient(180deg, #ff9a44, #f37b1d);
  color: #fff;
  border: none;
  border-radius: 30px;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  box-shadow: 0 4px 15px rgba(243, 123, 29, 0.5);
  transition: transform 0.1s;
  position: relative;
  z-index: 5;
  font-family: inherit;
}
.popup-join-btn:active { transform: scale(0.97); }

/* ---------- Wide screens & short landscape ---------- */
@media(min-width:760px),(orientation:landscape) and (max-height:520px){
  body{flex-direction:row;height:100vh;height:100dvh;overflow:hidden}
  .auth-hero{width:48%;height:100%;flex-shrink:0}
  .auth-hero::after{display:none}
  .auth-logo{bottom:auto;top:50%;transform:translate(-50%,-50%);width:84px;height:84px;border-width:4px}
  .auth-card{flex:1;justify-content:center;overflow-y:auto;padding:20px 24px}
  .auth-title{margin-top:0}
}
</style>
</head>
<body>

<!-- SPLASH SCREEN -->
<div id="splashScreen">
  <div class="splash-logo-wrapper">
    <div class="splash-logo"><img src="splash.png" alt="Splash Logo" onerror="this.src='app.png'"></div>
  </div>
  <div class="splash-name">SPLASH</div>
  <div class="splash-bar"><div class="splash-fill" id="splashFill"></div></div>
  <div class="splash-text" id="splashText">Loading... 0%</div>
</div>

<!-- Hero Banner -->
<div class="auth-hero">
  <img class="hero-bg" id="authBanner" src="enjoy.png" alt="Splash Banner" onerror="this.style.opacity=0">
  <div class="auth-logo"><img src="splash.png" alt="Logo" onerror="this.src='app.png'"></div>
</div>

<!-- Auth Card -->
<div class="auth-card">
  <div class="auth-title" id="authTitle">Login</div>

  <!-- LOGIN FORM -->
  <form class="auth-form" id="loginPane" onsubmit="event.preventDefault(); doLogin();">
    <div class="auth-input-group">
      <span class="auth-prefix">+256</span>
      <input type="tel" inputmode="tel" class="auth-input" id="loginPhone" placeholder="Enter Phone Number" autocomplete="tel" required>
    </div>

    <div class="auth-input-group">
      <span class="auth-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
      <input type="password" class="auth-input" id="loginPassword" placeholder="Enter Password" autocomplete="current-password" required>
      <div class="auth-eye" onclick="togglePassword('loginPassword', this)">
        <svg class="eye-off" viewBox="0 0 24 24"><path d="M9.9 9.9a3 3 0 1 0 4.2 4.2"/><path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c7 0 10 7 10 7a13.2 13.2 0 0 1-1.7 2.7"/><path d="M6.6 6.6A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="m2 2 20 20"/></svg>
        <svg class="eye-on" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
    </div>

    <label class="auth-remember"><input type="checkbox" id="rememberMe"><span>Remember me</span></label>

    <button type="submit" class="auth-btn" id="loginBtn"><div class="btn-spinner"></div><span>LOGIN</span></button>

    <div class="auth-switch">New here? <a href="#" onclick="toggleAuthTab('register'); return false;">Create Account</a></div>
  </form>

  <!-- REGISTER FORM -->
  <form class="auth-form" id="registerPane" style="display:none" onsubmit="event.preventDefault(); doRegister();">
    <div class="auth-input-group">
      <span class="auth-prefix">+256</span>
      <input type="tel" inputmode="tel" class="auth-input" id="regPhone" placeholder="Enter Phone Number" autocomplete="tel" required>
    </div>

    <div class="auth-input-group">
      <span class="auth-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
      <input type="password" class="auth-input" id="regPassword" placeholder="Enter Password" autocomplete="new-password" required>
      <div class="auth-eye" onclick="togglePassword('regPassword', this)">
        <svg class="eye-off" viewBox="0 0 24 24"><path d="M9.9 9.9a3 3 0 1 0 4.2 4.2"/><path d="M10.7 5.1A10.4 10.4 0 0 1 12 5c7 0 10 7 10 7a13.2 13.2 0 0 1-1.7 2.7"/><path d="M6.6 6.6A13.5 13.5 0 0 0 2 12s3 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="m2 2 20 20"/></svg>
        <svg class="eye-on" viewBox="0 0 24 24"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      </div>
    </div>

    <div class="auth-input-group">
      <span class="auth-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
      <input type="password" class="auth-input" id="regPassword2" placeholder="Re-enter Password" autocomplete="new-password" required>
    </div>

    <div class="auth-input-group">
      <span class="auth-icon"><svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg></span>
      <input type="text" inputmode="numeric" class="auth-input" id="regPin" maxlength="6" placeholder="6-digit Trade Password" required>
    </div>

    <div class="auth-input-group">
      <input type="text" class="auth-input" id="regReferral" placeholder="Invitation Code (Optional)" style="padding-left:16px">
    </div>

    <button type="submit" class="auth-btn" id="regBtn"><div class="btn-spinner"></div><span>REGISTER</span></button>

    <div class="auth-switch">Already have an account? <a href="#" onclick="toggleAuthTab('login'); return false;">Log In</a></div>
  </form>
</div>

<!-- REWARD POPUP MODAL -->
<div id="rewardPopup">
  <div class="popup-content">
    <button class="popup-close" onclick="closePopup()">✕</button>
    <img src="pop.png" alt="Download App Reward" class="popup-img" onerror="this.src='https://via.placeholder.com/400x600/fff/333?text=pop.png'">
    <!-- Button updated to open WhatsApp Channel -->
    <button class="popup-join-btn" onclick="window.open('https://whatsapp.com/channel/0029Vb9fUQK4Y9lto0EKCi37', '_blank'); closePopup();">Join Now</button>
  </div>
</div>

<!-- 1. LOAD THE BRAIN -->
<script src="splash.js"></script>

<script>
/* ===== SPLASH SCREEN ===== */
document.addEventListener('DOMContentLoaded', () => {
  let progress = 0;
  const fill = document.getElementById('splashFill');
  const text = document.getElementById('splashText');
  const splash = document.getElementById('splashScreen');
  const interval = setInterval(() => {
    progress += Math.random() * 1.5 + 0.5;
    if (progress > 100) progress = 100;
    fill.style.width = progress + '%';
    text.innerText = 'Loading... ' + Math.floor(progress) + '%';
    if (progress >= 100) {
      clearInterval(interval);
      setTimeout(() => { splash.classList.add('hide'); }, 1000);
    }
  }, 100);

  // Invite link (index.html?ref=CODE): open Create Account with the code filled in
  try {
    const ref = new URLSearchParams(window.location.search).get('ref');
    if (ref) {
      toggleAuthTab('register');
      document.getElementById('regReferral').value = ref;
    }
  } catch (e) {}
});

/* ===== AUTH & POPUP ===== */
function toast(t){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e)}e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}

function toggleAuthTab(tab) {
  const loginPane = document.getElementById('loginPane');
  const registerPane = document.getElementById('registerPane');
  const title = document.getElementById('authTitle');
  const banner = document.getElementById('authBanner');
  const isLogin = tab === 'login';
  loginPane.style.display = isLogin ? 'flex' : 'none';
  registerPane.style.display = isLogin ? 'none' : 'flex';
  title.textContent = isLogin ? 'Login' : 'Create Account';
  banner.style.opacity = 0;
  setTimeout(() => { banner.src = isLogin ? 'enjoy.png' : 'relax.png'; banner.style.opacity = 1; }, 150);
}

function togglePassword(inputId, iconEl) {
  const input = document.getElementById(inputId);
  if (input.type === 'password') { input.type = 'text'; iconEl.classList.add('active'); }
  else { input.type = 'password'; iconEl.classList.remove('active'); }
}

function showPopup() {
  document.getElementById('rewardPopup').classList.add('show');
}

function closePopup() {
  document.getElementById('rewardPopup').classList.remove('show');
  window.location.href = 'home.html';
}

// Helper to get users from local storage (the same list the admin panel manages)
function getUsers() {
    try { return JSON.parse(localStorage.getItem('splash_users')) || []; } catch (e) { return []; }
}

// Helper to save users
function saveUsers(users) {
    localStorage.setItem('splash_users', JSON.stringify(users));
}

function doLogin() {
  const btn = document.getElementById('loginBtn');
  const phone = document.getElementById('loginPhone').value.trim();
  const pass = document.getElementById('loginPassword').value;

  if (!phone || !pass) { toast('Please fill in all fields.'); return; }

  // 1. Validate against saved users (members deleted in the admin panel can no longer sign in)
  const users = getUsers();
  const user = users.find(u => String(u.phone) === phone && u.password === pass);

  if (!user) {
      toast('Invalid phone number or password.');
      return;
  }

  // Blocked in the admin panel?
  if (user.blocked) {
      toast('This account is blocked. Contact support.');
      return;
  }

  btn.classList.add('loading');
  btn.disabled = true;

  setTimeout(() => {
    btn.classList.remove('loading');
    btn.disabled = false;

    // Set active session
    localStorage.setItem('splash_current_user', phone);

    showPopup();
  }, 600);
}

function doRegister() {
  const btn = document.getElementById('regBtn');
  const phone = document.getElementById('regPhone').value.trim();
  const pass = document.getElementById('regPassword').value;
  const pass2 = document.getElementById('regPassword2').value;
  const pin = document.getElementById('regPin').value.trim();
  const referral = document.getElementById('regReferral').value.trim();

  if (!phone || !pass || !pass2 || !pin) { toast('Please fill in all required fields.'); return; }
  if (pass !== pass2) { toast('Passwords do not match!'); return; }
  if (pin.length !== 6) { toast('Trade password must be exactly 6 digits.'); return; }

  // 2. Check if phone number already exists
  const users = getUsers();
  if (users.find(u => String(u.phone) === phone)) {
      toast('This phone number is already registered.');
      return;
  }

  // The invitation code is the inviter's phone number: it must belong to a real member
  let inviter = null;
  if (referral) {
      inviter = users.find(u => String(u.phone) === referral);
      if (!inviter || String(inviter.phone) === phone) {
          toast('Invitation code not found. Check it or leave it empty.');
          return;
      }
  }

  btn.classList.add('loading');
  btn.disabled = true;

  setTimeout(() => {
    btn.classList.remove('loading');
    btn.disabled = false;

    // 3. Save the new user (read the list again in case the admin changed it meanwhile)
    const list = getUsers();
    if (list.find(u => String(u.phone) === phone)) {
        toast('This phone number is already registered.');
        return;
    }

    // Welcome bonus is whatever the admin has set right now
    const bonus = Splash.welcomeBonus;

    const newUser = {
        phone: phone,
        password: pass,
        tradePin: pin,
        referral: inviter ? String(inviter.phone) : null,
        balance: bonus,
        bonusGiven: bonus,
        totalIncome: 0,
        vipLevel: 0,
        blocked: false,
        orders: [],
        joinedAt: Date.now()
    };

    list.push(newUser);
    saveUsers(list);

    // Log the welcome bonus to the admin's transaction chart
    try {
        const adminTx = JSON.parse(localStorage.getItem('splash_admin_tx')) || [];
        adminTx.unshift({
            id: 'T' + Date.now() + Math.floor(Math.random() * 99),
            type: 'add',
            phone: String(phone),
            amount: bonus,
            note: 'Welcome bonus',
            ts: Date.now()
        });
        localStorage.setItem('splash_admin_tx', JSON.stringify(adminTx.slice(0, 500)));
    } catch (e) {}

    // Set active session
    localStorage.setItem('splash_current_user', phone);

    // Show success toast
    toast(`Account created! You received ${Splash.formatMoney(bonus)}.`);

    // Show the popup after a slight delay
    setTimeout(showPopup, 1200);

  }, 600);
}
</script>
</body>
</html>
