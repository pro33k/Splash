<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Balance Detail - Splash</title>
<style>
:root{--red:#f37b1d;--red-light:#ffa74f;--red-deep:#cc5a00;--gold:#ffcc00;--navy:#3d2b1f;--green:#1fa84f;--red-err:#e0412a;--amber:#b78a00}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.4;background:#fcfaf8;color:#222;width:100%;min-height:100vh;position:relative;padding-bottom:84px;overflow-x:hidden}
img,svg{max-width:100%}
.i3d{display:block;filter:drop-shadow(0 2px 2px rgba(120,60,0,.3))}
.back{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#fff}
.back svg{width:20px;height:20px}
.float-wrap{position:fixed;right:10px;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:90}
.float-gift img{display:block;width:48px;height:auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;padding:5px 0 calc(7px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600;color:#666;text-decoration:none;flex:1;max-width:100px}
.icon-wrapper{width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.nav-item svg{width:28px;height:28px;opacity:.85}
.nav-item.active{color:var(--red-deep);font-weight:800}
.nav-item.active .icon-wrapper{transform:translateY(-3px) scale(1.1)}
.nav-item.active svg{opacity:1}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(40,28,20,.92);color:#fff;padding:9px 16px;border-radius:30px;font-size:13px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86%;text-align:center}
.toast.show{opacity:1}

.float-app{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;}
.float-app img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
.float-app span{background:linear-gradient(160deg,var(--gold),var(--red));color:#fff;font-size:9px;font-weight:900;letter-spacing:1px;padding:1px 8px;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.page-header{position:relative;height:52px;background:linear-gradient(180deg,var(--red-light),var(--red));border-radius:0 0 20px 20px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(204,90,0,.25)}
.page-header h1{color:#fff;font-size:clamp(16px,4.6vw,19px);font-weight:800}

.content{max-width:820px;margin:0 auto;padding:12px}
.bal-box{position:relative;overflow:hidden;border-radius:20px;padding:16px 16px 14px;color:#fff;background:linear-gradient(135deg,#ffa74f,#f37b1d 55%,#b34d00);box-shadow:0 8px 18px rgba(204,90,0,.3);animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.bal-box::before{content:"";position:absolute;width:70%;aspect-ratio:1;right:-20%;top:-60%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 68%)}
.bal-l{font-size:12px;font-weight:700;opacity:.9;letter-spacing:.5px;position:relative}
.bal-v{font-size:clamp(22px,7vw,28px);font-weight:800;margin-top:2px;position:relative;text-shadow:0 2px 4px rgba(0,0,0,.2)}
.sums{display:flex;gap:8px;margin-top:12px;position:relative}
.sums div{flex:1;background:rgba(255,255,255,.18);border-radius:12px;padding:7px 10px;font-size:11px;font-weight:600;backdrop-filter:blur(4px)}
.sums b{display:block;font-size:13px;font-weight:800;margin-top:1px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:12px;background:#f3e9e0;border-radius:16px;padding:4px}
.tab{border:none;border-radius:12px;padding:9px 2px;background:transparent;color:var(--red-deep);font-size:clamp(12px,3.4vw,13.5px);font-weight:800;cursor:pointer;font-family:inherit;transition:background .25s,color .25s,box-shadow .25s}
.tab.active{background:linear-gradient(180deg,var(--red-light),var(--red));color:#fff;box-shadow:0 4px 10px rgba(243,123,29,.4)}
.day-row{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px}
.day{display:flex;align-items:center;gap:9px;color:var(--red-deep);font-size:clamp(14px,4vw,16px);font-weight:800}
.day::before{content:"";width:7px;height:20px;border-radius:4px;background:linear-gradient(180deg,var(--red-light),var(--red-deep))}
.count{background:#ffe9d9;color:var(--red-deep);font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:20px}
.stripe{border-radius:20px;padding:5px;background:repeating-linear-gradient(135deg,var(--red) 0 10px,#ffe6d0 10px 20px);box-shadow:0 3px 10px rgba(243,123,29,.18);animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.stripe-in{background:#fff;border-radius:16px;padding:2px 12px}
.rec{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #f1e8df}
.rec:last-child{border-bottom:none}
.rec-ico svg{width:30px;height:30px}
.rec-info{flex:1;min-width:0}
.rec-title{color:var(--red-deep);font-size:clamp(13px,3.8vw,14.5px);font-weight:800}
.rec-sub{color:#9a8f87;font-size:11.5px;margin-top:1px}
.rec-sub b{color:#b88600}
.rec-amt{font-size:clamp(12.5px,3.6vw,14px);font-weight:800;white-space:nowrap}
.pos{color:var(--green)}.neg{color:var(--red-err)}.pending{color:var(--amber)}
.empty{text-align:center;color:#a39990;font-size:14px;margin:50px 0}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:700px){.content{padding:18px 20px}}
@media(max-height:500px){.nav-item{font-size:10px}.icon-wrapper{width:26px;height:26px}.nav-item svg{width:24px;height:24px}body{padding-bottom:64px}.float-wrap{bottom:64px}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffad5c"/><stop offset="1" stop-color="#f37b1d"/></linearGradient>
<linearGradient id="gRd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cc5a00"/><stop offset="1" stop-color="#8a3b00"/></linearGradient>
<linearGradient id="gG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5b3"/><stop offset="1" stop-color="#ffcc00"/></linearGradient>
<linearGradient id="gW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f0e6d6"/></linearGradient>
<linearGradient id="gK" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4a52"/><stop offset="1" stop-color="#0c0c10"/></linearGradient>
<linearGradient id="gGd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6a800"/><stop offset="1" stop-color="#996600"/></linearGradient>
<linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
<radialGradient id="rR" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffc28a"/><stop offset=".45" stop-color="#f37b1d"/><stop offset="1" stop-color="#8a3b00"/></radialGradient>
<radialGradient id="rG" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fffbe0"/><stop offset=".45" stop-color="#ffcc00"/><stop offset="1" stop-color="#996600"/></radialGradient>
<radialGradient id="rW" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#f5efe6"/><stop offset="1" stop-color="#b8afa5"/></radialGradient>
<symbol id="bust" viewBox="0 0 64 64"><path d="M6 63Q6 40 32 40Q58 40 58 63Z" fill="var(--c,#f37b1d)"/><path d="M6 63Q6 40 32 40Q58 40 58 63Z" fill="url(#gS)"/><circle cx="32" cy="23" r="14" fill="url(#rW)"/><path d="M18 21Q19 7 32 7Q45 7 46 21Q39 14 32 14Q25 14 18 21Z" fill="var(--k,#222)"/></symbol>
<symbol id="arrow" viewBox="0 0 24 24"><path d="M9 1H15V11H20L12 22L4 11H9Z" fill="url(#gRd)" transform="translate(0,1.5)"/><path d="M9 1H15V11H20L12 22L4 11H9Z" fill="url(#gR)"/><path d="M9 1H15V11H20L12 22L4 11H9Z" fill="url(#gS)"/></symbol>
</defs></svg>
<header class="page-header">
  <a href="my.html" class="back" aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 4L7 12L15 20" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg></a>
  <h1>Balance Detail</h1>
</header>
<main class="content">
  <div class="bal-box"><div class="bal-l">Current Balance</div><div class="bal-v" id="bal">UGX 0.00</div>
    <div class="sums"><div>Total In<b id="sin">UGX 0.00</b></div><div>Total Out<b id="sout">UGX 0.00</b></div></div></div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-f="all">All</button>
    <button class="tab" data-f="income">Income</button>
    <button class="tab" data-f="expense">Expense</button>
    <button class="tab" data-f="withdraw">Withdraw</button>
  </div>
  <div id="list"></div>
</main>
<div class="float-wrap">
  <!-- CHEST -->
  <div class="float-gift" id="chest" style="cursor:pointer;">
    <img src="chest.png" alt="Chest" onerror="this.src='https://cdn3d.iconscout.com/3d/premium/thumb/treasure-chest-4248829-3529633.png'">
  </div>
  <!-- APP DOWNLOAD LINK -->
  <a href="app-download.html" class="float-app">
    <img src="app.png" alt="APP">
    <span>APP</span>
  </a>
</div>
<nav class="bottom-nav">
  <a href="home.html" class="nav-item"><div class="icon-wrapper"><svg class="i3d" viewBox="0 0 64 64"><path d="M11 36L32 20L53 36V58Q53 62 49 62H15Q11 62 11 58Z" fill="#b9bccb"/><path d="M11 34L32 18L53 34V56Q53 60 49 60H15Q11 60 11 56Z" fill="url(#gW)"/><rect x="43" y="9" width="7" height="14" rx="1.5" fill="url(#gK)"/><path d="M2 36L32 8L62 36L56 41L32 19L8 41Z" fill="url(#gRd)"/><path d="M2 33L32 5L62 33L56 38L32 16L8 38Z" fill="url(#gR)"/><rect x="26" y="40" width="12" height="20" rx="3" fill="url(#gG)"/><circle cx="35" cy="51" r="1.4" fill="#8a5300"/><rect x="14" y="40" width="9" height="9" rx="2" fill="#7ec8ff"/></svg></div><span>Home</span></a>
  <a href="service.html" class="nav-item"><div class="icon-wrapper"><svg class="i3d" viewBox="0 0 64 64"><ellipse cx="26" cy="54" rx="18" ry="6" fill="url(#gGd)"/><rect x="8" y="46" width="36" height="8" fill="url(#gG)"/><ellipse cx="26" cy="46" rx="18" ry="6" fill="#ffe27a"/><ellipse cx="26" cy="44" rx="18" ry="6" fill="url(#gGd)"/><rect x="8" y="36" width="36" height="8" fill="url(#gG)"/><ellipse cx="26" cy="36" rx="18" ry="6" fill="#ffe27a"/><ellipse cx="26" cy="34" rx="18" ry="6" fill="url(#gGd)"/><rect x="8" y="26" width="36" height="8" fill="url(#gG)"/><ellipse cx="26" cy="26" rx="18" ry="6" fill="#ffe27a"/><path d="M20 22L32 12L38 18L52 6" stroke="url(#gRd)" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round" transform="translate(0,2)"/><path d="M20 22L32 12L38 18L52 6" stroke="url(#gR)" stroke-width="5.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 2H61V19Z" fill="url(#gR)"/></svg></div><span>Income</span></a>
  <a href="myteam.html" class="nav-item"><div class="icon-wrapper"><svg class="i3d" viewBox="0 0 64 64"><use href="#bust" x="0" y="12" width="30" height="30" style="--c:#ffcc00"/><use href="#bust" x="34" y="12" width="30" height="30" style="--c:#3a3a44"/><use href="#bust" x="12" y="24" width="40" height="40" style="--c:#f37b1d"/></svg></div><span>Myteam</span></a>

  <a href="my.html" class="nav-item active"><div class="icon-wrapper"><svg class="i3d" viewBox="0 0 64 64"><use href="#bust" x="0" y="2" width="58" height="58" style="--c:#f37b1d"/><g transform="translate(50 50)"><path d="M0-13V-8M0 13V8M-13 0H-8M13 0H8M-9-9L-6-6M9 9L6 6M9-9L6-6M-9 9L-6 6" stroke="#b88600" stroke-width="4" stroke-linecap="round"/><circle r="9.5" fill="url(#rG)"/><circle r="4" fill="url(#gK)"/></g></svg></div><span>My</span></a>
</nav>

<script src="splash.js"></script>

<script>
const fmtDate=s=>{const p=String(s).slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const group=(arr)=>{const g={};arr.forEach(x=>{(g[x.date]=g[x.date]||[]).push(x)});return Object.keys(g).sort().reverse().map(d=>({date:d,items:g[d]}))};

const money = Splash.formatMoney;

const TRAY='<path d="M6 38V54Q6 60 12 60H52Q58 60 58 54V38Z" fill="url(#gRd)"/><path d="M6 36V50Q6 56 12 56H52Q58 56 58 50V36Z" fill="url(#gR)"/><path d="M6 36V50Q6 56 12 56H52Q58 56 58 50V36Z" fill="url(#gS)"/>';
const ICONS={
 deposit:TRAY+'<use href="#arrow" x="14" y="0" width="36" height="42"/>',
 withdraw:TRAY+'<g transform="translate(0 38) scale(1 -1)"><use href="#arrow" x="14" y="0" width="36" height="38"/></g>',
 income:'<circle cx="32" cy="35" r="27" fill="url(#gGd)"/><circle cx="32" cy="32" r="27" fill="url(#gG)"/><circle cx="32" cy="32" r="21" fill="none" stroke="#c98200" stroke-width="2"/><path d="M32 20V44M20 32H44" stroke="#996600" stroke-width="6" stroke-linecap="round"/>',
 expense:'<circle cx="32" cy="35" r="27" fill="url(#gRd)"/><circle cx="32" cy="32" r="27" fill="url(#gR)"/><circle cx="32" cy="32" r="27" fill="url(#gS)"/><path d="M20 32H44" stroke="#fff" stroke-width="6" stroke-linecap="round"/>',
 gift:'<circle cx="32" cy="35" r="27" fill="url(#gGd)"/><circle cx="32" cy="32" r="27" fill="url(#gG)"/><rect x="20" y="26" width="24" height="18" rx="2" fill="#996600"/><rect x="18" y="22" width="28" height="6" rx="2" fill="#c98200"/><rect x="30" y="22" width="4" height="22" fill="#8a3b00"/><ellipse cx="26" cy="18" rx="6" ry="4" fill="#c98200" transform="rotate(-20 26 18)"/><ellipse cx="38" cy="18" rx="6" ry="4" fill="#c98200" transform="rotate(20 38 18)"/>'
};

// Types that add to the balance
const PLUS=['deposit','income','welcome','gift'];

let DATA={balance:0,records:[]},FILTER='all';

function render(){
  document.getElementById('bal').textContent=money(DATA.balance||0);
  
  let tin=0, tout=0;
  DATA.records.forEach(r=>{
    const v=Math.abs(Number(r.amount)||0);
    if(PLUS.includes(r.type)) {
      tin += v;
    } else if(r.status !== 'Processing') {
      // pending withdrawals don't count until approved
      tout += v;
    }
  });
  
  document.getElementById('sin').textContent=money(tin);
  document.getElementById('sout').textContent=money(tout);
  
  const list=document.getElementById('list');list.innerHTML='';
  
  // Filter logic
  const recs=DATA.records.filter(r=>{
    if(FILTER==='all') return true;
    if(FILTER==='income') return ['deposit','income','welcome','gift'].includes(r.type);
    if(FILTER==='expense') return ['purchase','expense'].includes(r.type);
    if(FILTER==='withdraw') return r.type==='withdraw';
    return false;
  });
  
  if(!recs.length){list.innerHTML='<div class="empty">No records</div>';return;}
  
  group(recs).forEach(g=>{
    const row=document.createElement('div');row.className='day-row';
    row.innerHTML='<div class="day"></div><div class="count"></div>';
    row.querySelector('.day').textContent=fmtDate(g.date);
    row.querySelector('.count').textContent=g.items.length+(g.items.length>1?' rows':' row');
    list.appendChild(row);
    
    const card=document.createElement('div');card.className='stripe';
    const inner=document.createElement('div');inner.className='stripe-in';
    
    // Sort newest first within the day
    g.items.sort((a,b)=>(b.ts||0)-(a.ts||0)).forEach(r=>{
      const isPending = r.status === 'Processing' || r.status === 'Rejected';
      const plus = PLUS.includes(r.type);
      
      // Pick icon based on type
      let iconKey = 'income';
      if(r.type === 'deposit') iconKey = 'deposit';
      else if(r.type === 'withdraw') iconKey = 'withdraw';
      else if(r.type === 'purchase' || r.type === 'expense') iconKey = 'expense';
      else if(r.type === 'gift') iconKey = 'gift';
      
      const it=document.createElement('div');it.className='rec';
      it.innerHTML='<div class="rec-ico"><svg class="i3d" viewBox="0 0 64 64">'+(ICONS[iconKey]||ICONS.income)+'</svg></div><div class="rec-info"><div class="rec-title"></div><div class="rec-sub"><span class="t"></span> &middot; <b class="s"></b></div></div><div class="rec-amt"></div>';
      
      it.querySelector('.rec-title').textContent=r.title||r.type;
      it.querySelector('.t').textContent=r.time||'';
      
      const statusEl = it.querySelector('.s');
      statusEl.textContent=r.status||'Completed';
      if(r.status === 'Processing') statusEl.style.color = 'var(--amber)';
      if(r.status === 'Rejected') statusEl.style.color = 'var(--red-err)';
      if(r.status === 'Completed' || r.status === 'Approved') statusEl.style.color = 'var(--green)';
      
      const a=it.querySelector('.rec-amt');
      a.className='rec-amt '+(isPending?'pending':(plus?'pos':'neg'));
      
      // Pending withdrawals show in brackets
      if(r.status === 'Processing'){
        a.textContent='(-'+money(Math.abs(r.amount))+')';
      } else if(r.status === 'Rejected'){
        a.textContent='(Rejected)';
      } else {
        a.textContent=(plus?'+':'-')+money(Math.abs(r.amount));
      }
      
      inner.appendChild(it);
    });
    card.appendChild(inner);list.appendChild(card);
  });
}

function loadUserData() {
  const currentPhone = localStorage.getItem('splash_current_user');
  if (!currentPhone) { window.location.href = 'index.html'; return; }
  
  const users = JSON.parse(localStorage.getItem('splash_users')) || [];
  const user = users.find(u => String(u.phone) === String(currentPhone));
  
  if (user) {
    DATA.balance = Number(user.balance) || 0;
    DATA.records = [];
    
    // 1. Pull real transactions logged by the app
    if (Array.isArray(user.transactions) && user.transactions.length) {
      DATA.records = user.transactions.slice();
    } else if (DATA.balance > 0) {
      // Fallback for older accounts that registered before the transaction ledger existed
      DATA.records.push({
        type: 'welcome',
        title: 'Welcome Bonus',
        date: new Date(user.joinedAt || Date.now()).toISOString().split('T')[0],
        time: '00:00',
        status: 'Completed',
        amount: DATA.balance,
        ts: user.joinedAt || Date.now()
      });
    }
    
    // 2. Add any pending withdrawals that haven't been approved yet
    const pending = JSON.parse(localStorage.getItem('splash_pending_withdrawals')) || [];
    pending.filter(p => String(p.phone) === String(currentPhone)).forEach(p => {
      const d = new Date(p.ts || Date.now());
      DATA.records.push({
        type: 'withdraw',
        title: 'Withdrawal - ' + ((p.bank && p.bank.bank) || 'Bank'),
        date: d.toISOString().split('T')[0],
        time: d.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' }),
        status: 'Processing',
        amount: Number(p.amount) || 0,
        ts: p.ts || Date.now()
      });
    });
  }
  render();
}

document.getElementById('tabs').addEventListener('click',e=>{
  const b=e.target.closest('.tab');if(!b)return;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  b.classList.add('active');FILTER=b.dataset.f;render();
});

// Refresh when user returns to the tab or when admin updates data
document.addEventListener('visibilitychange', () => { if (!document.hidden) loadUserData(); });
window.addEventListener('storage', (e) => { 
  if (e.key === 'splash_users' || e.key === 'splash_pending_withdrawals') loadUserData(); 
});

loadUserData();
</script>
</body>
</html>
