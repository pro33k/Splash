<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light only" />
<meta name="theme-color" content="#f37b1d" />
<title>Share - Splash</title>
<style>
:root{color-scheme:light;--red:#f37b1d;--red-light:#ffa74f;--red-deep:#cc5a00;--gold:#ffcc00;--navy:#3d2b1f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;color-scheme:light}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#fcfaf8;color:#222;width:100%;min-height:100vh;position:relative;padding-bottom:95px;overflow-x:hidden;-webkit-text-fill-color:currentColor}
img,svg{max-width:100%}
.i3d{display:block;filter:drop-shadow(0 3px 2px rgba(120,60,0,.35))}

.page{width:100%}
/* ---------- Header ---------- */
.share-header{position:relative;width:100%;background:linear-gradient(160deg,var(--red-light),var(--red-deep));border-radius:0 0 30px 30px;overflow:hidden;min-height:150px}
.share-header img{display:block;width:100%;aspect-ratio:16/9;max-height:300px;object-fit:cover;object-position:center top;-webkit-mask-image:linear-gradient(#000 72%,transparent);mask-image:linear-gradient(#000 72%,transparent)}
.hero-txt{position:absolute;left:0;right:0;bottom:0;padding:0 18px 18px;text-align:center;color:#fff;z-index:2;text-shadow:0 2px 6px rgba(0,0,0,.35)}
.hero-txt h1{font-size:clamp(20px,5.4vw,28px);font-weight:800}
.hero-txt p{font-size:clamp(12px,3.3vw,15px);font-weight:600;margin-top:3px;opacity:.95}
.sparkle{position:absolute;width:10px;height:10px;border-radius:50%;background:rgba(255,255,255,.7);z-index:1;animation:twinkle 3s ease-in-out infinite}
.sparkle:nth-child(2){left:12%;top:22%;animation-delay:.3s}.sparkle:nth-child(3){left:82%;top:18%;animation-delay:1.1s;width:7px;height:7px}.sparkle:nth-child(4){left:70%;top:55%;animation-delay:1.9s;width:8px;height:8px}.sparkle:nth-child(5){left:25%;top:60%;animation-delay:2.4s;width:6px;height:6px}
@keyframes twinkle{0%,100%{opacity:0;transform:scale(.4)}50%{opacity:1;transform:scale(1)}}

/* ---------- Content ---------- */
.main-content{padding:14px 14px 20px;position:relative;z-index:10;max-width:680px;margin:0 auto}
.sec-t{display:flex;align-items:center;gap:10px;color:var(--navy);font-size:clamp(16px,4.2vw,19px);font-weight:800;margin:6px 2px 10px}
.sec-t::before{content:"";width:8px;height:22px;border-radius:5px;background:linear-gradient(180deg,var(--red-light),var(--red-deep))}
.info-card{background:#f7f2ed;border-radius:16px;padding:14px 16px;margin-bottom:12px}
.card-title{color:var(--red-deep);font-size:clamp(14px,2.5vw,16px);font-weight:800}

/* commission tiers */
.tiers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.tier{background:#fff;border-radius:18px;padding:14px 6px 12px;text-align:center;box-shadow:0 3px 12px rgba(0,0,0,.06);position:relative;overflow:hidden}
.tier::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(90deg,var(--red-light),var(--red-deep))}
.tier .lv{color:#9a8f87;font-size:12px;font-weight:700;letter-spacing:.5px}
.tier .pc{color:var(--red-deep);font-size:clamp(24px,7vw,32px);font-weight:800;margin-top:2px}
.tier .bar{height:5px;background:#f1e8df;border-radius:4px;margin:8px 14px 0;overflow:hidden}
.tier .bar i{display:block;height:100%;width:0;border-radius:4px;background:linear-gradient(90deg,var(--red-light),var(--red-deep));transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.tier:first-child{background:linear-gradient(160deg,#fff,#fff3e6)}

/* link card */
.url-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.url-box{flex:1;min-width:200px;line-height:1.6;word-break:break-all}
.url-box .card-title{display:inline}
#shareUrl{color:var(--red-deep);font-size:clamp(12px,2vw,13px);font-weight:700;margin-left:4px}
.copy-btn{background:linear-gradient(180deg,var(--red-light),var(--red));color:#fff;border:none;padding:9px 20px;border-radius:10px;font-weight:700;font-size:clamp(13px,2vw,14px);cursor:pointer;box-shadow:0 3px 8px rgba(243,123,29,.4);white-space:nowrap;transition:background .3s,transform .1s;font-family:inherit;animation:pulseBtn 2.6s ease-in-out infinite}
.copy-btn:active{transform:scale(.95)}
.copy-btn.ok{background:#25D366;animation:none}
@keyframes pulseBtn{0%,100%{box-shadow:0 3px 8px rgba(243,123,29,.4)}50%{box-shadow:0 3px 8px rgba(243,123,29,.4),0 0 0 7px rgba(243,123,29,.15)}}
.code-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding-top:12px;border-top:1.5px dashed #e6d5c6}
.code-lbl{color:#7a7068;font-size:13px;font-weight:600}
.code-chip{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px dashed var(--red);border-radius:12px;padding:6px 12px;color:var(--red-deep);font-weight:800;letter-spacing:1.5px;font-size:15px;cursor:pointer;font-family:inherit}
.code-chip svg{width:16px;height:16px}

.desc-text{font-size:clamp(13px,2vw,15px);color:#7a7068;line-height:1.55;text-align:center;margin-top:10px}

/* share buttons */
.share-actions{display:flex;gap:12px;margin-top:6px;flex-wrap:wrap}
.share-btn{flex:1;min-width:140px;display:flex;align-items:center;justify-content:center;gap:8px;padding:13px 8px;border-radius:30px;color:#fff;font-weight:800;font-size:clamp(14px,2.5vw,16px);text-decoration:none;background:linear-gradient(180deg,var(--red-light),var(--red-deep));box-shadow:0 4px 10px rgba(243,123,29,.4);transition:transform .1s;position:relative;overflow:hidden;border:none;cursor:pointer;font-family:inherit}
.share-btn:active{transform:scale(.97)}
.share-btn svg{width:18px;height:18px;fill:#fff}
.share-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-130%);animation:shine 4.5s ease-in-out infinite}
.share-btn:nth-child(2)::after{animation-delay:.6s}
.share-btn:nth-child(3)::after{animation-delay:1.2s}
@keyframes shine{0%,60%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.native{display:none;flex-basis:100%}

/* reveal */
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1);transition-delay:var(--d,0s)}
.rv.in{opacity:1;transform:none}

/* toast */
.toast{position:fixed;left:50%;bottom:130px;transform:translateX(-50%);background:rgba(40,28,20,.92);color:#fff;padding:11px 20px;border-radius:30px;font-size:14px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86%;text-align:center}
.toast.show{opacity:1}

/* floating */
.float-wrap{position:fixed;right:10px;bottom:110px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90}
.float-gift img{display:block;width:65px;height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25));animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-6px) rotate(-3deg)}}
.float-app{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;}
.float-app img{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.float-app span{background:linear-gradient(160deg,var(--gold),var(--red));color:#fff;font-size:11px;font-weight:900;letter-spacing:1px;padding:1px 10px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,.25)}

/* bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:#666;text-decoration:none;flex:1;max-width:120px}
.icon-wrapper{width:42px;height:42px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.nav-item svg{width:38px;height:38px;opacity:.85}
.nav-item .i3d{filter:drop-shadow(0 1px 0 rgba(255,255,255,.8)) drop-shadow(0 5px 3px rgba(120,60,0,.5)) drop-shadow(0 9px 8px rgba(120,60,0,.22))}
.nav-item.active{color:var(--red-deep);font-weight:800}
.nav-item.active .icon-wrapper{transform:translateY(-4px) scale(1.15)}
.nav-item.active svg{opacity:1}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}}

/* ---------- Responsive ---------- */
@media(max-width:360px){.main-content{padding:12px 10px}.share-btn{min-width:120px}.tiers{gap:7px}.code-row{flex-direction:column;align-items:stretch;text-align:center}.code-chip{justify-content:center}}
@media(min-width:768px){.float-wrap{bottom:120px}.share-header img{max-height:360px}.main-content{padding:20px 18px 30px}.info-card{padding:18px 20px}}
@media(min-width:900px),(orientation:landscape) and (min-width:700px) and (max-height:520px){
  .page{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);align-items:start;gap:0;min-height:calc(100vh - 95px)}
  .share-header{position:sticky;top:0;height:calc(100vh - 95px);min-height:260px;border-radius:0 30px 30px 0}
  .share-header img{height:100%;max-height:none;aspect-ratio:auto;-webkit-mask-image:linear-gradient(#000 78%,transparent);mask-image:linear-gradient(#000 78%,transparent)}
  .main-content{max-width:none;width:100%;padding:24px 28px 30px}
}
@media(max-height:520px) and (orientation:landscape){.float-wrap{bottom:84px}.float-gift img{width:48px}.float-app img{width:40px;height:40px}}
</style>
</head>

<script src="splash.js"></script>

<script>
let LINK = '';
let CODE = '';

document.addEventListener('DOMContentLoaded', () => {
    const me = Splash.requireUser();
    if (!me) return;

    const baseUrl = window.location.href.split('?')[0].replace('share.html', 'index.html');
    const dynamicLink = `${baseUrl}?ref=${me.phone}`;
    const dynamicCode = String(me.phone);

    document.getElementById('shareUrl').textContent = dynamicLink;
    document.getElementById('codeTxt').textContent = dynamicCode;
    LINK = dynamicLink;
    CODE = dynamicCode;

    const MSG = 'Join Splash and earn!';
    document.getElementById('waBtn').href = 'https://wa.me/?text=' + encodeURIComponent(MSG + ' ' + dynamicLink);
    document.getElementById('tgBtn').href = 'https://t.me/share/url?url=' + encodeURIComponent(dynamicLink) + '&text=' + encodeURIComponent(MSG);
    if (navigator.share) { document.getElementById('moreBtn').style.display = 'flex'; }

    const RATES = {
        lv1: Splash.referralRates.level1,
        lv2: Splash.referralRates.level2,
        lv3: Splash.referralRates.level3
    };

    document.getElementById('pc-1').dataset.to = RATES.lv1;
    document.getElementById('pc-2').dataset.to = RATES.lv2;
    document.getElementById('pc-3').dataset.to = RATES.lv3;

    document.getElementById('rewardText').textContent = `You can earn more revenue by sharing the link: LV1=${RATES.lv1}% LV2=${RATES.lv2}% LV3=${RATES.lv3}% Hurry and invite your friends to join us!`;

    initReveal();
});

function copyText(text, ok) {
  const done = () => {
    toast(ok);
    if (navigator.vibrate) navigator.vibrate(20);
  };
  const fallback = () => {
    const t = document.createElement('textarea');
    t.value = text;
    t.style.position = 'fixed';
    t.style.opacity = '0';
    document.body.appendChild(t);
    t.select();
    try { document.execCommand('copy'); done(); } catch(e) { toast('Failed to copy manually'); }
    document.body.removeChild(t);
  };
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text).then(done).catch(fallback);
  } else {
    fallback();
  }
}

function copyLink() {
  copyText(LINK, 'Link copied!');
  const b = document.getElementById('copyBtn');
  b.textContent = 'Copied!';
  b.classList.add('ok');
  setTimeout(() => { b.textContent = 'Copy'; b.classList.remove('ok'); }, 2000);
}

function copyCode() {
  copyText(CODE, 'Invite code copied!');
}

async function nativeShare() {
  try {
    await navigator.share({ title: 'Splash', text: 'Join Splash and earn!', url: LINK });
  } catch(e) {}
}

function toast(t) {
  let e = document.getElementById('toast');
  if (!e) {
    e = document.createElement('div');
    e.id = 'toast';
    e.className = 'toast';
    document.body.appendChild(e);
  }
  e.textContent = t;
  e.classList.add('show');
  clearTimeout(e._t);
  e._t = setTimeout(() => e.classList.remove('show'), 2200);
}

function countUp(el) {
  const to = +el.dataset.to, t0 = performance.now(), dur = 900;
  const step = t => {
    const p = Math.min((t - t0) / dur, 1);
    el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))) + '%';
    if (p < 1) requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

function reveal(el) {
  el.classList.add('in');
  el.querySelectorAll('.pc').forEach(countUp);
  el.querySelectorAll('.bar i').forEach(i => { i.style.width = i.dataset.w + '%'; });
}

function initReveal() {
  const items = document.querySelectorAll('.rv');
  if ('IntersectionObserver' in window) {
    const io = new IntersectionObserver(es => es.forEach(e => {
      if (e.isIntersecting) { reveal(e.target); io.unobserve(e.target); }
    }), { threshold: .15 });
    items.forEach(i => io.observe(i));
  } else {
    items.forEach(reveal);
  }
}
</script>
