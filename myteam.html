<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light only" />
<meta name="theme-color" content="#f37b1d" />
<title>My Team</title>
<style>
:root{
  color-scheme:light;
  --red:#f37b1d;--red-light:#ffa74f;--red-deep:#cc5a00;--gold:#ffcc00;--green:#1fa84f;
  --bg:#fcfaf8;--card:#fff;--soft:#f8f5f2;--text:#222;--muted:#887a72;--line:#f4ece6;--navy:#3d2b1f;--bar:#eee4da;
  --shadow:0 2px 8px rgba(0,0,0,.06);--nav-h:74px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth;color-scheme:light}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);width:100%;min-height:100vh;min-height:100dvh;position:relative;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px);overflow-x:hidden;-webkit-text-fill-color:currentColor}
img,svg{max-width:100%}
button,input,select{font-family:inherit}
.i3d{display:block;filter:drop-shadow(0 3px 2px rgba(120,60,0,.35))}
.page{width:100%;max-width:760px;margin:0 auto}

/* ---------- Banner + stats ---------- */
.main-content{padding:10px 10px 20px}
.team-banner{position:relative;width:100%;aspect-ratio:16/9;min-height:150px;max-height:260px;margin-bottom:30px}
.team-banner::before{content:"";position:absolute;inset:0;background:url('relax.png') center/cover no-repeat,linear-gradient(160deg,var(--red-light),var(--red-deep));border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.1);z-index:1}
.team-banner::after{content:"";position:absolute;inset:0;border-radius:20px;background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 55%);z-index:1}
.orbs{position:absolute;inset:0;border-radius:20px;overflow:hidden;z-index:1;pointer-events:none}
.orbs i{position:absolute;border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),rgba(255,255,255,.05));animation:drift 9s ease-in-out infinite}
.orbs i:nth-child(1){width:70px;height:70px;left:8%;top:14%}
.orbs i:nth-child(2){width:44px;height:44px;left:72%;top:10%;animation-delay:-3s;animation-duration:11s}
.orbs i:nth-child(3){width:30px;height:30px;left:50%;top:44%;animation-delay:-6s}
.orbs i:nth-child(4){width:56px;height:56px;left:88%;top:48%;animation-delay:-2s;animation-duration:12s}
@keyframes drift{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-14px)}}
.stats-card{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);width:92%;background:var(--card);border-radius:16px;display:flex;padding:12px 0;box-shadow:0 6px 18px rgba(0,0,0,.14);z-index:2;animation:pop .6s cubic-bezier(.2,.8,.2,1) both .1s}
.stat-item{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;gap:4px;padding:0 6px}
.stat-item:first-child{border-right:1px solid var(--line)}
.stat-label{color:var(--muted);font-size:clamp(12px,2vw,14px);font-weight:600}
.stat-value{color:var(--red-deep);font-size:clamp(15px,3.4vw,20px);font-weight:800;display:flex;justify-content:center;align-items:center;gap:4px;white-space:nowrap;min-width:0}
.stat-value span{overflow:hidden;text-overflow:ellipsis}
.stat-value svg{width:20px;height:20px;flex-shrink:0;animation:spinCoin 6s ease-in-out infinite}
@keyframes spinCoin{0%,70%,100%{transform:rotateY(0)}85%{transform:rotateY(180deg)}}

/* ---------- Toggle ---------- */
.toggle-container{position:relative;display:flex;background:var(--card);border-radius:14px;padding:5px;margin:14px 0 16px;box-shadow:var(--shadow)}
.toggle-container .pill{position:absolute;top:5px;bottom:5px;left:5px;width:calc(50% - 5px);border-radius:10px;background:linear-gradient(180deg,var(--red-light),var(--red));box-shadow:0 4px 10px rgba(243,123,29,.35);transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.toggle-container.r .pill{transform:translateX(100%)}
.toggle-btn{position:relative;overflow:hidden;z-index:1;flex:1;padding:12px 0;border:none;background:transparent;font-size:clamp(14px,2.5vw,16px);font-weight:700;color:var(--muted);border-radius:10px;cursor:pointer;transition:color .3s}
.toggle-btn.active{color:#fff}

/* ---------- Cards ---------- */
.card{background:var(--card);border-radius:16px;padding:18px;margin-bottom:16px;box-shadow:var(--shadow)}
.level-card{padding:20px}
.level-header{display:flex;align-items:center;gap:10px;margin-bottom:15px}
.level-badge{background:linear-gradient(180deg,var(--red-light),var(--red));color:#fff;font-size:12px;font-weight:800;padding:3px 8px;border-radius:6px;flex-shrink:0}
.level-title{font-size:clamp(15px,2.5vw,18px);font-weight:800;color:var(--navy)}
.ibtn{position:relative;overflow:hidden;margin-left:auto;width:36px;height:36px;border-radius:50%;border:none;background:var(--soft);color:var(--red-deep);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:transform .15s}
.ibtn:active{transform:scale(.9)}
.ibtn svg{width:19px;height:19px}
.ibtn.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.level-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.grid-box{background:var(--soft);border-radius:12px;padding:18px 8px;text-align:center;display:flex;flex-direction:column;gap:6px;min-width:0}
.grid-value{color:var(--red-deep);font-size:clamp(14px,2.6vw,18px);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grid-label{color:var(--muted);font-size:clamp(12px,2vw,13px);font-weight:600}
.swap{animation:swap .4s cubic-bezier(.2,.8,.2,1)}
@keyframes swap{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

/* invite */
.invite{background:linear-gradient(135deg,var(--red-light),var(--red-deep));color:#fff;position:relative;overflow:hidden}
.invite::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.14)}
.invite h3{font-size:clamp(15px,2.6vw,17px);font-weight:800;margin-bottom:12px}
.code-row{display:flex;gap:8px;align-items:center;position:relative;z-index:1}
.code-box{flex:1;min-width:0;background:rgba(255,255,255,.2);border:1px dashed rgba(255,255,255,.7);border-radius:10px;padding:10px 12px;font-weight:800;letter-spacing:1.5px;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-btn{position:relative;overflow:hidden;border:none;background:#fff;color:var(--red-deep);font-weight:800;font-size:13px;padding:11px 14px;border-radius:10px;cursor:pointer;flex-shrink:0;transition:transform .1s}
.mini-btn:active{transform:scale(.94)}

/* ---------- Level tabs ---------- */
.level-tabs-wrapper{margin-bottom:14px}
.level-tabs{display:flex;gap:8px;border:1px solid var(--red-light);padding:6px;border-radius:14px;background:var(--card)}
.tab-btn{position:relative;overflow:hidden;flex:1;padding:11px 0;border:none;background:var(--soft);color:var(--muted);font-size:clamp(13px,2vw,15px);font-weight:700;border-radius:9px;cursor:pointer;transition:background .3s,color .3s,transform .1s;display:flex;align-items:center;justify-content:center;gap:6px}
.tab-btn:active{transform:scale(.96)}
.tab-btn.active{background:var(--red-deep);color:#fff}
.tab-btn b{font-size:11px;min-width:18px;padding:1px 5px;border-radius:9px;background:rgba(0,0,0,.08);font-weight:800}
.tab-btn.active b{background:rgba(255,255,255,.28)}

/* tools */
.tools{display:flex;gap:8px;margin-bottom:12px}
.search{flex:1;min-width:0;position:relative}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted)}
.search input{width:100%;padding:11px 12px 11px 34px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:14px;outline:none;transition:border-color .2s,box-shadow .2s}
.search input:focus{border-color:var(--red);box-shadow:0 0 0 3px rgba(243,123,29,.18)}
.tools select{padding:0 10px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);font-size:13px;font-weight:700;outline:none;max-width:42%}

/* ---------- Members / empty ---------- */
.member{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--shadow);animation:swap .4s both}
.member .av{width:40px;height:40px;border-radius:12px;background:linear-gradient(160deg,var(--red-light),var(--red-deep));color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.member .mi{flex:1;min-width:0}
.member .mp{color:var(--navy);font-weight:800;font-size:14.5px;overflow:hidden;text-overflow:ellipsis}
.member .md{color:var(--muted);font-size:12px;margin-top:2px}
.member .ma{color:var(--green);font-weight:800;font-size:14px;white-space:nowrap}
.sk{height:64px;border-radius:14px;margin-bottom:10px;background:linear-gradient(100deg,var(--card) 30%,var(--soft) 50%,var(--card) 70%);background-size:300% 100%;animation:skl 1.2s linear infinite;box-shadow:var(--shadow)}
@keyframes skl{from{background-position:100% 0}to{background-position:-100% 0}}
.empty-state{text-align:center;color:var(--muted);font-size:15px;font-weight:600;padding:6px 0 30px}
.empty-state svg{width:64px;height:64px;display:block;margin:0 auto 8px;color:var(--bar);animation:float 3.5s ease-in-out infinite}
.empty-state a{display:inline-block;margin-top:10px;color:#fff;background:linear-gradient(180deg,var(--red-light),var(--red-deep));padding:9px 22px;border-radius:24px;font-weight:800;font-size:14px;text-decoration:none;box-shadow:0 4px 10px rgba(243,123,29,.35)}

.reward-view{display:none}
.team-view{display:block}

/* ---------- Reward ---------- */
.rw-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.rw-amt{font-size:clamp(16px,3vw,19px);font-weight:800;color:var(--red)}
.rw-row{font-size:14px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between;gap:8px;color:var(--navy)}
.rw-bar{width:100%;height:10px;background:var(--bar);border-radius:6px;margin-bottom:8px;overflow:hidden}
.rw-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--red-light),var(--red-deep));border-radius:6px;transition:width 1.1s cubic-bezier(.2,.8,.2,1);position:relative;overflow:hidden}
.rw-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.4s ease-in-out infinite}
.rw-sub{font-size:13px;font-weight:600;margin-bottom:15px;color:var(--muted)}
.buy-btn{display:block;width:100%;border:none;padding:14px;border-radius:12px;color:#fff;font-weight:800;font-size:clamp(14px,2.5vw,16px);background:linear-gradient(180deg,var(--red-light),var(--red-deep));cursor:pointer;transition:transform .1s;box-shadow:0 4px 10px rgba(243,123,29,.35);text-align:center;text-decoration:none;position:relative;overflow:hidden}
.buy-btn:active{transform:scale(.97)}
.buy-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-130%);animation:shine 4.5s ease-in-out infinite}
.buy-btn.done{background:var(--green);box-shadow:0 4px 10px rgba(31,168,79,.35)}
@keyframes shine{0%,60%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes pop{from{opacity:0;transform:translate(-50%,16px) scale(.96)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .55s ease-out forwards;pointer-events:none}
.tab-btn:not(.active) .rip,.ibtn .rip,.mini-btn .rip{background:rgba(243,123,29,.3)}
@keyframes ripple{to{transform:scale(3.2);opacity:0}}

/* ---------- Floating + nav ---------- */
.float-wrap{position:fixed;right:max(8px,env(safe-area-inset-right,0px));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s}
.float-wrap.hide{transform:translateX(90px);opacity:0}
.float-gift{background:none;border:none;cursor:pointer;animation:wiggle 4s ease-in-out infinite;transform-origin:50% 90%}
.float-gift img{display:block;width:clamp(48px,14vw,65px);height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-9deg)}88%{transform:rotate(8deg)}92%{transform:rotate(-5deg)}96%{transform:rotate(3deg)}}
.float-app{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;}
.float-app img{width:clamp(40px,12vw,54px);height:clamp(40px,12vw,54px);object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.float-app span{background:linear-gradient(160deg,var(--gold),var(--red));color:#fff;font-size:11px;font-weight:900;letter-spacing:1px;padding:1px 10px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);display:flex;justify-content:center;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(0,0,0,.1);z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;flex:1;max-width:120px;min-width:0}
.icon-wrapper{width:42px;height:42px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.nav-item svg{width:38px;height:38px;opacity:.85}
.nav-item .i3d{filter:drop-shadow(0 1px 0 rgba(255,255,255,.8)) drop-shadow(0 5px 3px rgba(120,60,0,.5)) drop-shadow(0 9px 8px rgba(120,60,0,.22))}
.nav-item.active{color:var(--red-deep);font-weight:800}
.nav-item.active .icon-wrapper{transform:translateY(-4px) scale(1.15)}
.nav-item.active svg{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 60px);transform:translate(-50%,10px);background:rgba(40,28,20,.94);color:#fff;padding:11px 20px;border-radius:30px;font-size:14px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:998}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Responsive ---------- */
@media(max-width:360px){
  :root{--nav-h:68px}
  .main-content{padding:8px 8px 20px}
  .card,.level-card{padding:14px}
  .level-grid{gap:8px}
  .grid-box{padding:14px 6px}
  .stat-value svg{display:none}
  .nav-item{font-size:11px}.nav-item svg{width:32px;height:32px}.icon-wrapper{width:36px;height:36px}
  .tools select{max-width:46%;font-size:12px}
  .mini-btn{padding:10px}
}
@media(min-width:600px){
  .level-grid{grid-template-columns:repeat(4,1fr)}
  .team-banner{max-height:300px}
  .bottom-nav{left:50%;right:auto;width:min(560px,100%);transform:translateX(-50%);border-radius:20px 20px 0 0}
}
@media(min-width:900px),(orientation:landscape) and (min-width:700px) and (max-height:520px){
  .page{max-width:1240px;display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:24px;padding:14px 22px;align-items:start}
  .main-content{display:contents}
  .team-banner{grid-column:1;position:sticky;top:14px;aspect-ratio:auto;height:min(380px,calc(100vh - 160px));height:min(380px,calc(100dvh - 160px));max-height:none;margin:0}
  .rightcol{grid-column:2;min-width:0}
  .toggle-container{margin-top:0}
  .level-grid{grid-template-columns:repeat(2,1fr)}
}
@media(max-height:520px) and (orientation:landscape){
  :root{--nav-h:58px}
  .float-gift img{width:44px}.float-app img{width:36px;height:36px}
  .bottom-nav{padding-top:4px}
  .nav-item{flex-direction:row;justify-content:center;gap:6px;max-width:150px}
  .nav-item svg{width:28px;height:28px}.icon-wrapper{width:30px;height:30px}
  .team-banner{min-height:120px}
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="gR" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffad5c"/><stop offset="1" stop-color="#f37b1d"/></linearGradient>
<linearGradient id="gRd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cc5a00"/><stop offset="1" stop-color="#8a3b00"/></linearGradient>
<linearGradient id="gG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff5b3"/><stop offset="1" stop-color="#ffcc00"/></linearGradient>
<linearGradient id="gW" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f0e6d6"/></linearGradient>
<linearGradient id="gK" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4a52"/><stop offset="1" stop-color="#0c0c10"/></linearGradient>
<linearGradient id="gGd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6a800"/><stop offset="1" stop-color="#996600"/></linearGradient>
<linearGradient id="gS" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset=".45" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".25"/></linearGradient>
<radialGradient id="rR" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#ffc28a"/><stop offset=".45" stop-color="#f37b1d"/><stop offset="1" stop-color="#8a3b00"/></radialGradient>
<radialGradient id="rG" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fffbe0"/><stop offset=".45" stop-color="#ffcc00"/><stop offset="1" stop-color="#996600"/></radialGradient>
<radialGradient id="rW" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#f5efe6"/><stop offset="1" stop-color="#b8afa5"/></radialGradient>
<symbol id="coin" viewBox="0 0 64 64"><circle cx="32" cy="35" r="27" fill="url(#gGd)"/><circle cx="32" cy="32" r="27" fill="url(#gG)"/><circle cx="32" cy="32" r="20" fill="none" stroke="#b88600" stroke-width="2.5"/><text x="32" y="42" text-anchor="middle" font-size="28" font-weight="900" font-family="Arial" fill="#996600">$</text><ellipse cx="22" cy="16" rx="11" ry="5" fill="#fff" opacity=".55" transform="rotate(-25 22 16)"/></symbol>
</defs></svg>

<canvas id="confetti" aria-hidden="true"></canvas>

<div class="page"><main class="main-content">
  <div class="team-banner">
    <div class="orbs" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="stats-card">
      <div class="stat-item"><span class="stat-label">Team Count</span><span class="stat-value" id="tCount">0</span></div>
      <div class="stat-item"><span class="stat-label">Total Commission</span><span class="stat-value"><svg viewBox="0 0 64 64"><use href="#coin"/></svg><span id="tComm">UGX 0.00</span></span></div>
    </div>
  </div>

  <div class="rightcol">
  <div class="toggle-container" id="toggle"><span class="pill"></span>
    <button class="toggle-btn active" onclick="switchView('team')" id="btn-team">Team</button>
    <button class="toggle-btn" onclick="switchView('reward')" id="btn-reward">Reward</button>
  </div>

  <!-- TEAM VIEW -->
  <div class="team-view" id="view-team">
    <div class="card invite">
      <h3>Invite friends, earn more</h3>
      <div class="code-row">
        <div class="code-box" id="codeBox">-</div>
        <button class="mini-btn" onclick="copyInvite()">Copy</button>
        <button class="mini-btn" onclick="shareInvite()">Share</button>
      </div>
    </div>

    <div class="card level-card" id="levelCard">
      <div class="level-header">
        <span class="level-badge" id="lvBadge">Lv1</span><span class="level-title" id="lvTitle">Level 1</span>
        <button class="ibtn" id="refreshBtn" onclick="loadLocalData()" aria-label="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20.5 8A9 9 0 1 0 21 12"/>
            <path d="M21 3v6h-6"/>
          </svg>
        </button>
      </div>
      <div class="level-grid">
        <div class="grid-box"><span class="grid-value" id="gMem">0</span><span class="grid-label">Members</span></div>
        <div class="grid-box"><span class="grid-value" id="gRate">0%</span><span class="grid-label">Rate</span></div>
        <div class="grid-box"><span class="grid-value" id="gComm">UGX 0.00</span><span class="grid-label">Commission</span></div>
        <div class="grid-box"><span class="grid-value" id="gPur">UGX 0.00</span><span class="grid-label">Purchase</span></div>
      </div>
    </div>

    <div class="level-tabs-wrapper"><div class="level-tabs">

    </div></div>

      <select id="sort" aria-label="Sort members"><option value="new">Newest</option><option value="top">Top purchase</option></select>
    </div>

<script src="splash.js"></script>

<script>
const INVITE_PAGE='index.html';

const RATES = {
  1: Splash.referralRates.level1,
  2: Splash.referralRates.level2,
  3: Splash.referralRates.level3
};

const EMPTY=()=>({inviteCode:'',levels:{1:{commission:0,purchase:0,members:[]},2:{commission:0,purchase:0,members:[]},3:{commission:0,purchase:0,members:[]}},rewards:[{bonus:5000,threshold:100000,spent:0}]});

let DATA=EMPTY(),LEVEL=1,VIEW='team',loaded=false,confettiShown=false;
let lastSig='';

function watchAdmin(fn){
  let t;
  const run=()=>{clearTimeout(t);t=setTimeout(fn,60)};
  addEventListener('storage',e=>{if(e.key===null||String(e.key).indexOf('splash_')===0)run()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)run()});
  setInterval(()=>{if(!document.hidden)fn()},3000);
}

const money = Splash.formatMoney;
const num=n=>Number(n||0).toLocaleString('en-US');

const $=id=>document.getElementById(id);
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
const store={get(k){try{return sessionStorage.getItem(k)}catch(e){return null}},set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}}};

function toast(t){let e=$('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e)}e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2200)}

function countTo(el,to,fmt){
  if(reduce){el.textContent=fmt(to);return}
  const t0=performance.now(),dur=900;
  const step=t=>{const p=Math.min((t-t0)/dur,1),v=to*(1-Math.pow(1-p,3));el.textContent=fmt(p<1?v:to);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

function renderTotals(){
  let c=0,m=0;[1,2,3].forEach(l=>{const d=DATA.levels[l]||{};c+=Number(d.commission)||0;m+=(d.members||[]).length;$('cnt-'+l).textContent=(d.members||[]).length});
  countTo($('tCount'),m,v=>num(Math.round(v)));
  countTo($('tComm'),c,v=>money(v));
}
function renderInvite(){$('codeBox').textContent=DATA.inviteCode||'Not available'}
function memberList(){
  const d=DATA.levels[LEVEL]||{members:[]};
  let ms=(d.members||[]).slice();
  const q=$('q').value.replace(/\D/g,'');
  if(q)ms=ms.filter(m=>String(m.phone||'').replace(/\D/g,'').includes(q));
  if($('sort').value==='top')ms.sort((a,b)=>(b.purchase||0)-(a.purchase||0));
  else ms.sort((a,b)=>String(b.date||'').localeCompare(String(a.date||'')));
  return ms;
}
function renderMembers(){
  const box=$('members');box.innerHTML='';
  const total=((DATA.levels[LEVEL]||{}).members||[]).length;
  $('tools').style.display=total?'flex':'none';
  const ms=memberList();
  if(!total){
    box.innerHTML='<div class="empty-state"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="22" cy="22" r="8"/><path d="M6 54C6 40 13 36 22 36C31 36 38 40 38 54"/><circle cx="46" cy="26" r="6"/><path d="M40 54C40 44 44 40 52 40C58 40 60 46 60 54"/></svg>No Members<br><a href="share.html">Invite friends</a></div>';
    return;
  }
  if(!ms.length){box.innerHTML='<div class="empty-state">No match found</div>';return}
  ms.forEach((m,i)=>{
    const p=String(m.phone||''),mp=p.length>6?p.slice(0,3)+'****'+p.slice(-3):p;
    const el=document.createElement('div');el.className='member';el.style.animationDelay=Math.min(i,12)*0.05+'s';
    el.innerHTML='<div class="av"></div><div class="mi"><div class="mp"></div><div class="md"></div></div><div class="ma"></div>';
    el.querySelector('.av').textContent=(p.slice(-2)||'#');
    el.querySelector('.mp').textContent=mp;
    el.querySelector('.md').textContent=m.date||'';
    el.querySelector('.ma').textContent=money(m.purchase);
    box.appendChild(el);
  });
}
function renderLevel(animate){
  const d=DATA.levels[LEVEL]||{commission:0,purchase:0,members:[]};
  $('lvBadge').textContent='Lv'+LEVEL;$('lvTitle').textContent='Level '+LEVEL;
  $('gMem').textContent=num((d.members||[]).length);
  $('gRate').textContent=RATES[LEVEL]+'%';
  $('gComm').textContent=money(d.commission);
  $('gPur').textContent=money(d.purchase);
  if(animate){const c=$('levelCard');c.classList.remove('swap');void c.offsetWidth;c.classList.add('swap')}
  renderMembers();
}
function renderRewards(){
  const v=$('view-reward');v.innerHTML='';
  (DATA.rewards||[]).forEach((r,i)=>{
    const pct=Math.max(0,Math.min(100,(r.spent/r.threshold)*100||0)),done=pct>=100;
    const c=document.createElement('div');c.className='card level-card';c.dataset.done=done?'1':'';
    c.innerHTML='<div class="rw-top"><span class="level-badge" style="background:var(--red-deep)"></span><span class="rw-amt"></span></div>'+
      '<div class="rw-row"><span>Consumption Threshold</span><span class="th"></span></div>'+
      '<div class="rw-bar"><i></i></div><div class="rw-sub"></div>'+
      (done?'<div class="buy-btn done">Reward unlocked</div>':'<a class="buy-btn" href="share.html">Share to Unlock</a>');
    c.querySelector('.level-badge').textContent='Tier '+(i+1);
    c.querySelector('.rw-amt').textContent='+'+money(r.bonus).replace('.00','');
    c.querySelector('.th').textContent=money(r.threshold).replace('.00','');
    const left=Math.max(0,r.threshold-r.spent);
    c.querySelector('.rw-sub').textContent=money(r.spent).replace('.00','')+' / '+money(r.threshold).replace('.00','')+'  ('+Math.floor(pct)+'%)'+(done?'':' · '+money(left).replace('.00','')+' to go');
    v.appendChild(c);
    c.querySelector('.rw-bar i').dataset.w=pct;
  });
}
function growBars(){document.querySelectorAll('.rw-bar i').forEach(b=>{b.style.width='0';void b.offsetWidth;b.style.width=b.dataset.w+'%'})}
function renderAll(){renderTotals();renderInvite();renderLevel(false);renderRewards();if(VIEW==='reward')growBars()}

function switchView(view){
  VIEW=view;store.set('mt_view',view);
  const t=view==='team';
  $('btn-team').classList.toggle('active',t);$('btn-reward').classList.toggle('active',!t);
  $('toggle').classList.toggle('r',!t);
  $('view-team').style.display=t?'block':'none';
  $('view-reward').style.display=t?'none':'block';
  buzz(8);
  if(!t){growBars();if(!confettiShown&&document.querySelector('#view-reward [data-done="1"]')){confettiShown=true;setTimeout(burst,350)}}
}
function switchLevel(l){
  LEVEL=l;store.set('mt_lv',l);buzz(8);
  [1,2,3].forEach(i=>$('tab-'+i).classList.toggle('active',i===l));
  renderLevel(true);
}

function loadLocalData(src){
  const auto = src === 'auto';
  const me = Splash.requireUser();
  if (!me) return;
  const btn = $('refreshBtn');
  if (!auto) btn.classList.add('spin');
  if (!loaded) $('members').innerHTML = '<div class="sk"></div><div class="sk"></div><div class="sk"></div>';

  let users = [];
  try { users = JSON.parse(localStorage.getItem('splash_users')) || []; } catch (e) {}

  const ph = String(me.phone);
  const kidsOf = phones => users.filter(u => u.referral && phones.indexOf(String(u.referral)) > -1);
  const lvl1 = kidsOf([ph]);
  const lvl2 = kidsOf(lvl1.map(u => String(u.phone)));
  const lvl3 = kidsOf(lvl2.map(u => String(u.phone)));

  const bought = u => (u.orders || []).reduce((s, o) => s + (Number(o.price) || 0), 0);
  const dayOf = t => { const d = new Date(t); return isNaN(d) ? '' : d.toISOString().split('T')[0]; };

  const build = (members, level) => {
    let comm = 0, pur = 0;
    const list = members.map(m => {
      const amt = bought(m);
      pur += amt;
      comm += Splash.calculateCommission(amt, level);
      return { phone: m.phone, date: dayOf(m.joinedAt || Date.now()), purchase: amt };
    });
    return { commission: comm, purchase: pur, members: list };
  };

  const L = { 1: build(lvl1, 1), 2: build(lvl2, 2), 3: build(lvl3, 3) };
  const next = {
    inviteCode: ph,
    levels: L,
    rewards: [{ bonus: 5000, threshold: 100000, spent: L[1].purchase + L[2].purchase + L[3].purchase }]
  };

  const sig = JSON.stringify(next);
  const changed = sig !== lastSig;
  lastSig = sig;
  DATA = next;
  if (!loaded || changed) { loaded = true; renderAll(); }
  setTimeout(() => btn.classList.remove('spin'), 500);
  if (!auto) toast('Updated');
}

function inviteLink(){const u=new URL(INVITE_PAGE,location.href);if(DATA.inviteCode)u.searchParams.set('ref',DATA.inviteCode);return u.href}
async function copyInvite(){
  const link=inviteLink();
  try{await navigator.clipboard.writeText(link)}catch(e){
    const t=document.createElement('textarea');t.value=link;t.style.cssText='position:fixed;opacity:0';document.body.appendChild(t);t.select();try{document.execCommand('copy')}catch(_){}t.remove();
  }
  buzz(12);toast('Invite link copied');
}
async function shareInvite(){
  const link=inviteLink();
  if(navigator.share){try{await navigator.share({title:'Join my team',text:'Join my team and start earning!',url:link});return}catch(e){if(e&&e.name==='AbortError')return}}
  copyInvite();
}

function burst(){
  if(reduce)return;
  const cv=$('confetti'),ctx=cv.getContext('2d'),dpr=window.devicePixelRatio||1;
  cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.scale(dpr,dpr);
  const cols=['#f37b1d','#ffcc00','#ffa74f','#1fa84f','#ffffff'];
  const ps=Array.from({length:90},()=>({x:innerWidth/2,y:innerHeight*.45,vx:(Math.random()-.5)*12,vy:-Math.random()*13-3,s:Math.random()*7+4,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[Math.random()*cols.length|0]}));
  let f=0;
  (function tick(){
    ctx.clearRect(0,0,innerWidth,innerHeight);
    ps.forEach(p=>{p.vy+=.35;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);ctx.restore()});
    if(++f<150)requestAnimationFrame(tick);else ctx.clearRect(0,0,innerWidth,innerHeight);
  })();
}

document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.buy-btn,.tab-btn,.toggle-btn,.ibtn,.mini-btn');if(!b)return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*.6,sp=document.createElement('span');
  sp.className='rip';sp.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
  if(getComputedStyle(b).position==='static')b.style.position='relative';
  b.appendChild(sp);setTimeout(()=>sp.remove(),600);
});

(function(){
  let sx=0,sy=0,ok=false;const v=$('view-team');
  v.addEventListener('touchstart',e=>{ok=!e.target.closest('input,select,.code-row');sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});
  v.addEventListener('touchend',e=>{
    if(!ok)return;const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
    if(Math.abs(dx)>70&&Math.abs(dx)>Math.abs(dy)*2){const n=LEVEL+(dx<0?1:-1);if(n>=1&&n<=3)switchLevel(n)}
  },{passive:true});
})();

(function(){
  let last=scrollY,tick=false;const w=$('floatWrap');
  addEventListener('scroll',()=>{if(tick)return;tick=true;requestAnimationFrame(()=>{const y=scrollY;if(y>last+6&&y>120)w.classList.add('hide');else if(y<last-6||y<=120)w.classList.remove('hide');last=y;tick=false})},{passive:true});
})();

$('q').addEventListener('input',renderMembers);
$('sort').addEventListener('change',renderMembers);

(function init(){
  const lv=parseInt(store.get('mt_lv'),10);
  if(lv>=1&&lv<=3){LEVEL=lv;[1,2,3].forEach(i=>$('tab-'+i).classList.toggle('active',i===lv))}
  loadLocalData('auto');
  if(store.get('mt_view')==='reward')switchView('reward');
  watchAdmin(()=>loadLocalData('auto'));
})();
</script>
