<html lang="en">

<meta charset="UTF-8" />

<title>Gift Code - Splash</title>
<style>
:root{--red:#f37b1d;--red-light:#ffa74f;--red-deep:#cc5a00;--gold:#ffcc00;--navy:#3d2b1f;--green:#1fa84f;--amber:#b78a00;--red-err:#ef4444}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.4;background:#fcfaf8;color:#222;width:100%;min-height:100vh;position:relative;padding-bottom:84px;overflow-x:hidden}
img,svg{max-width:100%}
.i3d{display:block;filter:drop-shadow(0 2px 2px rgba(120,60,0,.3))}
.back{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#fff}
.back svg{width:20px;height:20px}
.float-wrap{position:fixed;right:10px;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:90}
.float-gift img{display:block;width:48px;height:auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;padding:5px 0 calc(7px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600;color:#666;text-decoration:none;flex:1;max-width:100px}
.icon-wrapper{width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.nav-item svg{width:28px;height:28px;opacity:.85}
.nav-item.active{color:var(--red-deep);font-weight:800}
.nav-item.active .icon-wrapper{transform:translateY(-3px) scale(1.1)}
.nav-item.active svg{opacity:1}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(40,28,20,.92);color:#fff;padding:9px 16px;border-radius:30px;font-size:13px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86%;text-align:center}
.toast.show{opacity:1}

.float-app{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;}
.float-app img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
.float-app span{background:linear-gradient(160deg,var(--gold),var(--red));color:#fff;font-size:9px;font-weight:900;letter-spacing:1px;padding:1px 8px;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.empty{text-align:center;color:#a39990;font-size:14px;margin:22px 0}
.panel{background:#faf5f0;border-radius:20px;padding:10px 12px 16px;box-shadow:0 3px 12px rgba(0,0,0,.04)}
.f-l{display:block;color:#6b5f57;font-size:14px;font-weight:800;margin:4px 3px 7px}
.f-in{display:flex;align-items:center;gap:10px;background:#ffe9d9;border-radius:16px;padding:0 14px;height:46px}
.f-in input{flex:1;border:none;outline:none;background:transparent;font-size:14.5px;color:var(--navy);font-weight:600;height:100%;min-width:0;font-family:inherit;text-transform:uppercase}
.f-in input::placeholder{color:#8e857d;font-weight:600;text-transform:none}
.f-in svg{width:24px;height:24px;flex-shrink:0}
.btn{width:100%;border:none;border-radius:30px;padding:12px;background:linear-gradient(180deg,var(--red-light),var(--red-deep));color:#fff;font-size:15px;font-weight:800;letter-spacing:.5px;box-shadow:0 5px 12px rgba(243,123,29,.4);cursor:pointer;font-family:inherit;transition:transform .1s,opacity .2s}
.btn:active{transform:scale(.98)}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-row{display:flex;gap:10px;margin-top:16px}
.plain-header{position:relative;height:50px;display:flex;align-items:center;justify-content:center}
.plain-header h1{color:var(--navy);font-size:clamp(16px,4.8vw,19px);font-weight:800}
.plain-header .back{color:var(--navy)}
.gift-hero{border-radius:24px;padding:16px 14px 20px;text-align:center;background:linear-gradient(160deg,var(--red-light),var(--red-deep));box-shadow:0 8px 18px rgba(243,123,29,.32)}
.gift-hero svg{width:72px;height:72px;margin:0 auto;display:block}
.gift-hero h2{color:#fff;font-size:clamp(18px,5.4vw,22px);font-weight:800;margin-top:6px}
.gift-hero p{color:rgba(255,255,255,.95);font-size:clamp(12px,3.5vw,14px);margin-top:3px}
.note{text-align:center;color:#8e857d;font-size:12px;margin-top:10px}
.sec .t{display:flex;align-items:center;gap:9px;color:var(--navy);font-size:clamp(15px,4.3vw,17px);font-weight:800}
.sec .t::before{content:"";width:7px;height:20px;border-radius:4px;background:linear-gradient(180deg,var(--red-light),var(--red-deep))}
.rec-list{display:grid;grid-template-columns:1fr;gap:8px}

.rec-list .a{color:var(--green);font-weight:800;font-size:14px}
.rec-list .empty{grid-column:1/-1}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:500;padding:20px}

.code-status.ok{background:#e0f6ee;color:var(--green);border:1.5px solid #a8e5c8}
.code-status.warn{background:#fdf3c4;color:var(--amber);border:1.5px solid #f0dc85}
.code-status.err{background:#fee2e2;color:var(--red-err);border:1.5px solid #f5b7b7}
.code-status.loading{background:#f4f1ee;color:#8e857d;border:1.5px solid #e0d8cf}

/* Summary card above history */

.summary .s{flex:1;background:#fff;border-radius:14px;padding:12px;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}

.summary .s .l{color:#8e857d;font-size:11px;font-weight:600;margin-top:2px;text-transform:uppercase;letter-spacing:.4px}

main{display:grid;grid-template-columns:1fr;gap:10px;padding:6px 12px 0}
@media(min-width:700px){
main{grid-template-columns:1fr 1fr;gap:14px;padding:8px 18px 0;align-items:start}
.sec,.rec-list,.summary{grid-column:1/-1}

}

<script>
function toast(t){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e)}e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}

/* ========== HELPERS ========== */
function readUsers(){ return JSON.parse(localStorage.getItem('splash_users')) || []; }
function readCodes(){ return JSON.parse(localStorage.getItem('splash_gift_codes')) || []; }
function getCurrentUser(phone){ return readUsers().find(u => String(u.phone) === String(phone)); }

/**
 * Inspect a code for THIS user.
 * Returns one of:
 *   { state: 'empty' }
 *   { state: 'invalid', message }
 *   { state: 'disabled', message }
 *   { state: 'expired', message }
 *   { state: 'used_up', message }
 *   { state: 'claimed', message, claimedAt }
 *   { state: 'ready', amount }
 */
function inspectCode(code, phone) {
  if (!code) return { state: 'empty' };

  const codes = readCodes();
  const c = codes.find(x => String(x.code).toUpperCase() === code);
  if (!c) return { state: 'invalid', message: 'This gift code does not exist' };

  if (c.disabled) return { state: 'disabled', message: 'This gift code has been disabled by admin' };

  if (c.expiresAt && Date.now() >= c.expiresAt) {
    return { state: 'expired', message: 'This gift code has expired' };
  }

  const maxUses = c.maxUses === undefined ? 1 : (Number(c.maxUses) || 0);
  const currentUses = (c.uses || []).length;
  if (c.used || (maxUses > 0 && currentUses >= maxUses)) {
    // Check if THIS user already got it (better message)
    if ((c.uses || []).some(u => String(u) === String(phone))) {
      return { state: 'claimed', message: 'You already claimed this code', claimedAt: findClaimedAt(phone, c.code) };
    }
    return { state: 'used_up', message: 'This gift code has been fully claimed' };
  }

  // Has THIS specific user already used it?
  if ((c.uses || []).some(u => String(u) === String(phone))) {
    return { state: 'claimed', message: 'You already claimed this code', claimedAt: findClaimedAt(phone, c.code) };
  }

  return { state: 'ready', amount: Number(c.amount) || 0 };
}

function findClaimedAt(phone, code) {
  const u = getCurrentUser(phone);
  const entry = (u?.giftHistory || []).find(g => String(g.code).toUpperCase() === String(code).toUpperCase());
  return entry ? entry.time : null;
}

/* ========== LIVE STATUS AS USER TYPES ========== */
const STATUS_ICONS = { ok: '✓ ', warn: '⚠ ', err: '✕ ', loading: '… ' };

function renderStatus(status, message, cls) {
  const el = document.getElementById('codeStatus');
  if (!status) { el.classList.remove('show'); return; }
  el.className = 'code-status ' + cls + ' show';
  el.textContent = message;
}

let liveTimer = null;
function scheduleLiveCheck() {
  clearTimeout(liveTimer);
  liveTimer = setTimeout(runLiveCheck, 400);
}

function runLiveCheck() {
  const code = document.getElementById('code').value.trim().toUpperCase();
  const phone = localStorage.getItem('splash_current_user');
  if (!phone) return;

  if (!code) { renderStatus(false); return; }

  renderStatus(true, 'Checking…', 'loading');

  // small delay so the "Checking…" feels intentional
  setTimeout(() => {
    const result = inspectCode(code, phone);

    if (result.state === 'empty') {
      renderStatus(false);
    } else if (result.state === 'ready') {
      renderStatus(true, '✓ Valid code — tap Redeem to claim it', 'ok');
    } else if (result.state === 'claimed') {
      const when = result.claimedAt ? ' on ' + result.claimedAt : '';
      renderStatus(true, '⚠ You already claimed this code' + when + '. Each code can only be claimed once.', 'warn');
    } else if (result.state === 'expired') {
      renderStatus(true, '✕ ' + result.message, 'err');
    } else if (result.state === 'disabled') {
      renderStatus(true, '✕ ' + result.message, 'err');
    } else if (result.state === 'used_up') {
      renderStatus(true, '✕ ' + result.message, 'err');
    } else if (result.state === 'invalid') {
      renderStatus(true, '✕ ' + result.message, 'err');
    }
  }, 150);
}

/* ========== HISTORY ========== */
function drawRecs() {
  const phone = localStorage.getItem('splash_current_user');
  const user = getCurrentUser(phone);
  const history = (user && user.giftHistory) || [];

  // Summary
  const summary = document.getElementById('summary');
  if (history.length) {
    summary.style.display = 'flex';
    document.getElementById('sumCount').textContent = history.length;
    const total = history.reduce((s, h) => s + (Number(h.amount) || 0), 0);
    document.getElementById('sumTotal').textContent = Splash.formatMoney(total).replace('.00', '');
  } else {
    summary.style.display = 'none';
  }

  const box = document.getElementById('recs');
  if (!history.length) {
    box.innerHTML = '<div class="empty">No gift records yet — redeem your first code above</div>';
    return;
  }
  box.innerHTML = '';
  history.slice().reverse().forEach(r => {
    const d = document.createElement('div');
    d.className = 'it';
    d.innerHTML = '<div><div class="c"></div><div class="d"></div></div><div class="a"></div>';
    d.querySelector('.c').textContent = r.code;
    d.querySelector('.d').textContent = r.time;
    d.querySelector('.a').textContent = '+' + Splash.formatMoney(r.amount);
    box.appendChild(d);
  });
}

/* ========== REDEEM ========== */
function redeem() {
  const codeInput = document.getElementById('code').value.trim().toUpperCase();
  if (!codeInput) return toast('Please enter a gift code');

  const phone = localStorage.getItem('splash_current_user');
  if (!phone) { window.location.href = 'index.html'; return; }

  // SECURITY — re-verify user hasn't been blocked/deleted
  const me = getCurrentUser(phone);
  if (!me) { window.location.href = 'index.html'; return; }
  if (me.blocked) { window.location.href = 'index.html'; return; }

  const go = document.getElementById('go');
  go.disabled = true;
  go.textContent = 'Claiming…';

  setTimeout(() => {
    go.disabled = false;
    go.textContent = 'Redeem Gift Code';

    // 1. Inspect current state (fresh read — prevents double-claim)
    const check = inspectCode(codeInput, phone);

    if (check.state === 'invalid')    return toast('Invalid gift code');
    if (check.state === 'disabled')   return toast('This gift code has been disabled');
    if (check.state === 'expired')    return toast('This gift code has expired');
    if (check.state === 'used_up')    return toast('This gift code has been fully claimed');
    if (check.state === 'claimed') {
      const when = check.claimedAt ? ' on ' + check.claimedAt : '';
      return toast('You already claimed this code' + when);
    }

    // 2. State is 'ready' — mark it used
    const codes = readCodes();
    const codeIndex = codes.findIndex(c => String(c.code).toUpperCase() === codeInput);
    if (codeIndex === -1) return toast('Gift code no longer exists');

    const c = codes[codeIndex];
    const amt = Number(c.amount) || 0;
    const maxUses = c.maxUses === undefined ? 1 : (Number(c.maxUses) || 0);

    // Double-check one more time (paranoid but safe)
    if ((c.uses || []).some(u => String(u) === String(phone))) {
      return toast('You already claimed this code');
    }

    if (!c.uses) c.uses = [];
    c.uses.push(String(phone));
    if (maxUses > 0 && c.uses.length >= maxUses) c.used = true;
    codes[codeIndex] = c;
    localStorage.setItem('splash_gift_codes', JSON.stringify(codes));

    // 3. Credit user balance + transactions + giftHistory
    const users = readUsers();
    const userIndex = users.findIndex(u => String(u.phone) === String(phone));
    if (userIndex === -1) return toast('User not found. Please log in again.');

    users[userIndex].balance = (Number(users[userIndex].balance) || 0) + amt;

    // Save to giftHistory
    if (!users[userIndex].giftHistory) users[userIndex].giftHistory = [];
    users[userIndex].giftHistory.push({
      code: c.code,
      amount: amt,
      time: new Date().toLocaleString()
    });

    // Save to unified transaction ledger (balance.html)
    if (!users[userIndex].transactions) users[userIndex].transactions = [];
    const now = new Date();
    users[userIndex].transactions.unshift({
      type: 'gift',
      title: 'Gift Code ' + c.code,
      amount: amt,
      status: 'Completed',
      date: now.toISOString().split('T')[0],
      time: now.toLocaleTimeString('en-US', { hour12: false, hour: '2-digit', minute: '2-digit' }),
      ts: Date.now()
    });
    users[userIndex].transactions = users[userIndex].transactions.slice(0, 100);

    localStorage.setItem('splash_users', JSON.stringify(users));

    // 4. Log to admin dashboard as type 'gift'
    try {
      const adminTx = JSON.parse(localStorage.getItem('splash_admin_tx')) || [];
      adminTx.unshift({
        id: 'T' + Date.now() + Math.floor(Math.random() * 99),
        type: 'gift',
        phone: String(phone),
        amount: amt,
        note: 'Gift code ' + c.code,
        ts: Date.now()
      });
      localStorage.setItem('splash_admin_tx', JSON.stringify(adminTx.slice(0, 500)));
    } catch (e) { console.error('Admin TX log failed:', e); }

    // 5. Celebrate
    drawRecs();
    document.getElementById('mamt').textContent = '+' + Splash.formatMoney(amt);
    const newBal = Number(users[userIndex].balance) || 0;
    document.getElementById('mbal').textContent = 'New balance: ' + Splash.formatMoney(newBal);
    document.getElementById('modal').classList.add('show');
    document.getElementById('code').value = '';
    renderStatus(false);

    console.log('%c[Gift Claimed]', 'color:#1fa84f;font-weight:bold', c.code, '+', amt, '→ new balance:', newBal);
  }, 500);
}

/* ========== INIT ========== */
document.addEventListener('DOMContentLoaded', () => {
  const me = Splash.requireUser();
  if (!me) return;
  drawRecs();

  const input = document.getElementById('code');
  input.addEventListener('input', scheduleLiveCheck);
  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') { e.preventDefault(); redeem(); }
  });
});

window.addEventListener('storage', e => {
  if (e.key === 'splash_gift_codes' || e.key === 'splash_users') drawRecs();
});
document.addEventListener('visibilitychange', () => {
  if (!document.hidden) drawRecs();
});
</script>
