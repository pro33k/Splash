<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#f37b1d" />
<title>Service - Orders</title>
<style>
:root{--red:#f37b1d;--red-light:#ffa74f;--red-deep:#cc5a00;--gold:#ffcc00;--green:#1fa84f;--bg:#fcfaf8;--card:#fff;--soft:#fff5ee;--softline:#ffe4cc;--text:#222;--muted:#887a72;--line:#f1e8e0;--navy:#3d2b1f;--bar:#eee4da;--app-w:480px;--nav-h:74px;--shadow:0 2px 10px rgba(0,0,0,.06)}
@media(prefers-color-scheme:dark){:root{--bg:#17110c;--card:#231a13;--soft:#2c2118;--softline:#43311f;--text:#f3e9df;--muted:#b3a399;--line:#34281e;--navy:#f6e6d6;--bar:#3a2d22;--shadow:0 2px 10px rgba(0,0,0,.35)}}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);max-width:var(--app-w);margin:0 auto;min-height:100vh;min-height:100dvh;position:relative;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 24px);overflow-x:hidden;transition:max-width .3s ease;box-shadow:0 0 20px rgba(0,0,0,.05)}
button{font-family:inherit}
svg,img{max-width:100%}

/* Header */
.header{background:linear-gradient(90deg,var(--red-light),var(--red-deep));color:#fff;padding:calc(16px + env(safe-area-inset-top,0px)) 12px 16px;font-size:18px;font-weight:800;width:100%;position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 10px rgba(0,0,0,.12)}
.header .ibtn{position:absolute;right:max(12px,env(safe-area-inset-right,0px));top:50%;transform:translateY(-50%)}
.ibtn{position:relative;overflow:hidden;width:36px;height:36px;border-radius:50%;border:none;background:rgba(255,255,255,.22);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .15s}
.header .ibtn:active{transform:translateY(-50%) scale(.9)}
.ibtn svg{width:19px;height:19px}
.ibtn.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.main-content{padding:15px 15px 20px}

/* Earnings card */
.earnings-card{background:var(--card);border:2px solid var(--red);border-radius:16px;padding:20px;margin-bottom:18px;box-shadow:0 4px 12px rgba(243,123,29,.12);position:relative;overflow:hidden;animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.earnings-card::before{content:"";position:absolute;right:-40px;top:-40px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,rgba(243,123,29,.16),transparent 70%);animation:pulse 4s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.2)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.earnings-title{color:var(--red-deep);text-align:center;font-size:17px;font-weight:800;margin-bottom:6px}
.earnings-subtitle{color:var(--muted);text-align:center;font-size:13px;margin-bottom:18px}
.timer-container{display:flex;justify-content:center;align-items:center;gap:clamp(3px,1.2vw,6px);margin-bottom:14px}
.time-block{background:linear-gradient(180deg,#333,#111);color:#fff;font-size:clamp(20px,6.5vw,26px);font-weight:800;width:clamp(34px,10.5vw,42px);height:clamp(42px,12.5vw,50px);display:flex;justify-content:center;align-items:center;border-radius:8px;box-shadow:0 3px 0 #000;overflow:hidden;position:relative;font-variant-numeric:tabular-nums}
.time-block::after{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:rgba(255,255,255,.08)}
.digit-inner{display:inline-block;transform-origin:center}
@keyframes slideUpScale{0%{transform:translateY(100%) scale(.8);opacity:0}60%{transform:translateY(-10%) scale(1.15);opacity:1}100%{transform:translateY(0) scale(1);opacity:1}}
.animate{animation:slideUpScale .4s cubic-bezier(.2,.8,.2,1) forwards}
.time-colon{color:var(--red);font-size:24px;font-weight:bold;margin-bottom:6px;animation:blink 1s steps(2,start) infinite}
@keyframes blink{50%{opacity:.25}}
.timer-container.urgent .time-block{box-shadow:0 3px 0 #000,0 0 14px rgba(243,123,29,.7)}
.day-bar{height:8px;border-radius:6px;background:var(--bar);overflow:hidden;margin:0 auto 6px;max-width:320px}
.day-bar i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(90deg,var(--red-light),var(--red-deep));transition:width 1s linear;position:relative;overflow:hidden}
.day-bar i::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(255,255,255,.5) 50%,transparent 70%);transform:translateX(-100%);animation:shine 2.6s ease-in-out infinite}
@keyframes shine{0%,50%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.day-pct{text-align:center;color:var(--muted);font-size:12px;font-weight:600;margin-bottom:18px}
.income-container{background:var(--soft);border-radius:12px;padding:15px 10px;display:flex;justify-content:space-between;border:1px solid var(--softline)}
.income-item{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;gap:6px;padding:0 4px}
.income-item:first-child{border-right:1px solid var(--softline)}
.income-label{color:var(--muted);font-size:13px;font-weight:600}
.income-value{color:var(--red-deep);font-size:clamp(15px,4.6vw,18px);font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Records */
.order{background:var(--card);border-radius:14px;padding:14px;margin-bottom:10px;box-shadow:var(--shadow);animation:rise .45s both}
.o-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.o-ic{width:40px;height:40px;border-radius:12px;background:linear-gradient(160deg,var(--red-light),var(--red-deep));display:flex;align-items:center;justify-content:center;color:#fff;flex-shrink:0}
.o-ic svg{width:22px;height:22px}
.o-name{flex:1;min-width:0}
.o-name b{display:block;color:var(--navy);font-size:14.5px;font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.o-name small{color:var(--muted);font-size:12px;font-weight:600}
.badge{font-size:11px;font-weight:800;padding:3px 9px;border-radius:20px;flex-shrink:0}
.badge.active{background:rgba(31,168,79,.14);color:var(--green)}
.badge.done{background:var(--bar);color:var(--muted)}
.o-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.o-grid div{background:var(--soft);border-radius:10px;padding:8px 10px;min-width:0}
.o-grid span{display:block;font-size:11.5px;color:var(--muted);font-weight:600}
.o-grid b{display:block;font-size:13.5px;font-weight:800;color:var(--red-deep);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.o-bar{height:7px;background:var(--bar);border-radius:5px;overflow:hidden;margin-bottom:5px}
.o-bar i{display:block;height:100%;width:0;border-radius:5px;background:linear-gradient(90deg,var(--red-light),var(--red-deep));transition:width 1s cubic-bezier(.2,.8,.2,1)}
.o-days{font-size:12px;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;gap:8px}
.records-card{background:var(--card);border-radius:16px;padding:44px 20px 36px;text-align:center;box-shadow:var(--shadow);margin-bottom:20px}
.records-card svg{width:64px;height:64px;color:var(--bar);margin:0 auto 10px;display:block;animation:float 3.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.records-title{color:var(--red-deep);font-size:18px;font-weight:800;margin-bottom:10px}
.records-subtitle{color:var(--muted);font-size:14px;font-weight:500;margin-bottom:18px}
.buy-btn{position:relative;overflow:hidden;display:inline-block;border:none;padding:12px 28px;border-radius:26px;color:#fff;font-weight:800;font-size:14.5px;background:linear-gradient(180deg,var(--red-light),var(--red-deep));cursor:pointer;box-shadow:0 4px 10px rgba(243,123,29,.35);text-decoration:none;transition:transform .1s}
.buy-btn:active{transform:scale(.96)}
.buy-btn::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 40%,rgba(255,255,255,.35) 50%,transparent 60%);transform:translateX(-130%);animation:shine2 4.5s ease-in-out infinite}
@keyframes shine2{0%,60%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
.sk{height:120px;border-radius:14px;margin-bottom:10px;background:linear-gradient(100deg,var(--card) 30%,var(--soft) 50%,var(--card) 70%);background-size:300% 100%;animation:skl 1.2s linear infinite;box-shadow:var(--shadow)}
@keyframes skl{from{background-position:100% 0}to{background-position:-100% 0}}
.rip{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);transform:scale(0);animation:ripple .55s ease-out forwards;pointer-events:none}
@keyframes ripple{to{transform:scale(3.2);opacity:0}}

/* Floating */
.i3d{display:block;filter:drop-shadow(0 3px 2px rgba(120,60,0,.35))}
.float-wrap{position:fixed;right:max(8px,calc((100vw - var(--app-w))/2 + 8px));bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 14px);display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;transition:transform .35s cubic-bezier(.2,.8,.2,1),opacity .3s,right .3s}
.float-wrap.hide{transform:translateX(90px);opacity:0}
.float-gift{background:none;border:none;cursor:pointer;animation:wiggle 4s ease-in-out infinite;transform-origin:50% 90%}
.float-gift img{display:block;width:clamp(48px,14vw,65px);height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
@keyframes wiggle{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-9deg)}88%{transform:rotate(8deg)}92%{transform:rotate(-5deg)}96%{transform:rotate(3deg)}}
.float-app{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;}
.float-app img{width:clamp(40px,12vw,54px);height:clamp(40px,12vw,54px);object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.float-app span{background:linear-gradient(160deg,var(--gold),var(--red));color:#fff;font-size:11px;font-weight:900;letter-spacing:1px;padding:1px 10px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,.25)}

/* Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:var(--app-w);margin:0 auto;background:var(--card);display:flex;justify-content:center;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(0,0,0,.1);z-index:100;transition:max-width .3s ease}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);text-decoration:none;flex:1;max-width:120px;min-width:0}
.icon-wrapper{width:42px;height:42px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.nav-item svg{width:38px;height:38px;opacity:.85}
.nav-item.active{color:var(--red-deep);font-weight:800}
.nav-item.active .icon-wrapper{transform:translateY(-4px) scale(1.15)}
.nav-item.active svg{opacity:1}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom,0px) + 60px);transform:translate(-50%,10px);background:rgba(40,28,20,.94);color:#fff;padding:11px 20px;border-radius:30px;font-size:14px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;max-width:86%;text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(max-width:360px){:root{--nav-h:68px}.main-content{padding:12px 10px 20px}.earnings-card{padding:16px 12px}.nav-item{font-size:11px}.nav-item svg{width:32px;height:32px}.icon-wrapper{width:36px;height:36px}.o-grid{gap:6px}.o-grid div{padding:7px 8px}}
@media(min-width:768px){:root{--app-w:720px}.main-content{max-width:600px;margin:0 auto;width:100%}.time-block{width:50px;height:60px;font-size:30px}}
@media(min-width:1024px){:root{--app-w:980px}.earnings-card{padding:30px}.time-block{width:56px;height:68px;font-size:34px}.time-colon{font-size:30px}.income-value{font-size:22px}}
@media(max-height:520px) and (orientation:landscape){:root{--nav-h:58px}.header{padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px;font-size:16px}.bottom-nav{padding-top:4px}.nav-item{flex-direction:row;justify-content:center;gap:6px;max-width:150px}.nav-item svg{width:28px;height:28px}.icon-wrapper{width:30px;height:30px}.float-gift img{width:44px}.float-app img{width:36px;height:36px}}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const BUY_PAGE='home.html';
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms)}catch(e){}};
function toast(t){let e=$('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e)}e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2300)}

let DATA={todayIncome:0,totalIncome:0,orders:[]},FILTER='all',loaded=false;

/* ---------- countdown to next local midnight ---------- */
const digits=document.querySelectorAll('#timer .digit-inner');
function updateDigit(el,v){
  if(el.textContent!==v){
    el.textContent=v;
    if(reduce)return;
    el.classList.remove('animate');void el.offsetWidth;el.classList.add('animate');
  }
}
let lastRemain=null;
function tick(){
  const now=new Date(),next=new Date(now);next.setHours(24,0,0,0);
  const remain=Math.max(0,Math.round((next-now)/1000));
  const h=String(Math.floor(remain/3600)).padStart(2,'0'),m=String(Math.floor(remain%3600/60)).padStart(2,'0'),s=String(remain%60).padStart(2,'0');
  const str=h+m+s;
  for(let i=0;i<6;i++)updateDigit(digits[i],str[i]);
  $('timer').setAttribute('aria-label','Settlement in '+h+' hours '+m+' minutes '+s+' seconds');
  $('timer').classList.toggle('urgent',remain<=60);
  const pct=(86400-remain)/86400*100;
  $('dayBar').style.width=pct.toFixed(2)+'%';
  $('dayPct').textContent=pct.toFixed(1)+'% of today elapsed';
  if(lastRemain!==null&&remain>lastRemain+3600){toast('Daily settlement complete');buzz([20,60,20]);loadData()}  // rolled over midnight
  lastRemain=remain;
}
tick();setInterval(tick,1000);

/* ---------- count-up ---------- */
function countTo(el,to){
  if(reduce){el.textContent=Splash.formatMoney(to);return}
  const t0=performance.now(),dur=900;
  const step=t=>{const p=Math.min((t-t0)/dur,1),v=to*(1-Math.pow(1-p,3));el.textContent=Splash.formatMoney(p<1?v:to);if(p<1)requestAnimationFrame(step)};
  requestAnimationFrame(step);
}

/* ---------- orders ---------- */
const ICON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/><path d="M12 11v10"/></svg>';
function renderOrders(){
  const box=$('orders');box.innerHTML='';
  const all=DATA.orders||[];
  const list=all.filter(o=>FILTER==='all'||o.status===FILTER);
  if(!all.length){
    box.innerHTML='<div class="records-card"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><div class="records-title">No records</div><div class="records-subtitle">Buy your first product to start earning</div><a class="buy-btn" href="'+BUY_PAGE+'">Buy now</a></div>';
    return;
  }
  if(!list.length){box.innerHTML='<div class="records-card" style="padding:30px 20px"><div class="records-subtitle" style="margin:0">No '+(FILTER==='active'?'active':'completed')+' orders</div></div>';return}
  list.slice().reverse().forEach((o,i)=>{
    const done=o.status==='done';
    const elapsed=Math.max(0,(o.days||0)-(o.left||0));
    const pct=o.days?Math.min(100,elapsed/o.days*100):0;
    const el=document.createElement('div');el.className='order';el.style.animationDelay=Math.min(i,10)*0.06+'s';
    el.innerHTML='<div class="o-top"><div class="o-ic">'+ICON+'</div><div class="o-name"><b></b><small></small></div><span class="badge"></span></div>'+
      '<div class="o-grid"><div><span>Price</span><b class="p"></b></div><div><span>Daily income</span><b class="d"></b></div></div>'+
      '<div class="o-bar"><i></i></div><div class="o-days"><span class="l"></span><span class="e"></span></div>';
    el.querySelector('.o-name b').textContent=o.name||'Product';
    el.querySelector('.o-name small').textContent=o.date||'';
    const bd=el.querySelector('.badge');bd.textContent=done?'Completed':'Active';bd.className='badge '+(done?'done':'active');
    el.querySelector('.p').textContent=Splash.formatMoney(o.price);
    el.querySelector('.d').textContent=Splash.formatMoney(o.daily);
    el.querySelector('.l').textContent=done?'Finished':(o.left+' day'+(o.left===1?'':'s')+' left');
    el.querySelector('.e').textContent='Earned '+Splash.formatMoney((o.daily||0)*elapsed);
    box.appendChild(el);
    const bar=el.querySelector('.o-bar i');
    requestAnimationFrame(()=>requestAnimationFrame(()=>bar.style.width=pct+'%'));
  });
}
function renderAll(){
  countTo($('vToday'),Number(DATA.todayIncome)||0);
  countTo($('vTotal'),Number(DATA.totalIncome)||0);
  renderOrders();
}

/* ---------- data from the shared member list (admin panel) ---------- */
function loadData(manual){
  const btn=$('refreshBtn');btn.classList.add('spin');
  if(!loaded)$('orders').innerHTML='<div class="sk"></div><div class="sk"></div>';

  // 1. Who is signed in?
  const phone=localStorage.getItem('splash_current_user');
  if(!phone){window.location.href='index.html';return}

  // 2. Member must still exist and not be blocked by the admin
  let user=Splash.getUser(phone);
  if(!user||user.blocked){
    localStorage.removeItem('splash_current_user');
    window.location.href='index.html';
    return;
  }

  // 3. SELF-HEAL BROKEN ORDERS (fixes old data missing 'left', 'days', 'date' as string, etc.)
  let users=JSON.parse(localStorage.getItem('splash_users'))||[];
  let uidx=users.findIndex(x=>String(x.phone)===String(phone));
  if(uidx!==-1){
    let changed=false;
    users[uidx].orders=(users[uidx].orders||[]).map(o=>{
      // Fix missing left
      if(o.left===undefined){o.left=o.days||30;changed=true;}
      // Fix missing days
      if(o.days===undefined){o.days=30;changed=true;}
      // Fix date timestamp
      if(typeof o.date==='number'){o.date=new Date(o.date).toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});changed=true;}
      if(!o.date){o.date=new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});changed=true;}
      // Fix payout timers
      if(!o.createdAt){o.createdAt=Date.now();changed=true;}
      if(!o.lastPayout){o.lastPayout=Date.now();changed=true;}
      if(o.earned===undefined){o.earned=0;changed=true;}
      return o;
    });
    if(changed){
      localStorage.setItem('splash_users',JSON.stringify(users));
      user=users[uidx];
    }
  }

  setTimeout(()=>{
    // 4. Pay any daily income that is due, then read the fresh data
    const paid=Splash.settleOrders(phone);
    const u=Splash.getUser(phone)||user;
    DATA.totalIncome=u.totalIncome||0;
    DATA.orders=u.orders||[];
    DATA.todayIncome=DATA.orders.filter(o=>o.status==='active').reduce((sum,o)=>sum+Number(o.daily||0),0);
    loaded=true;
    btn.classList.remove('spin');
    renderAll();
    if(paid>0)toast('Income added: '+Splash.formatMoney(paid));
    else if(manual)toast('Updated');
  },500);
}

/* ---------- wiring ---------- */
$('refreshBtn').addEventListener('click',()=>{buzz(8);loadData(true)});
document.addEventListener('visibilitychange',()=>{if(!document.hidden){tick();if(loaded)loadData(false)}});
window.addEventListener('storage',e=>{if(e.key==='splash_users'&&loaded)loadData(false)});

document.addEventListener('pointerdown',e=>{
  const b=e.target.closest('.buy-btn');if(!b)return;
  const r=b.getBoundingClientRect(),s=Math.max(r.width,r.height)*.6,sp=document.createElement('span');
  sp.className='rip';sp.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(e.clientX-r.left-s/2)+'px;top:'+(e.clientY-r.top-s/2)+'px';
  b.appendChild(sp);setTimeout(()=>sp.remove(),600);
});

(function(){
  let last=scrollY,t=false;const w=$('floatWrap');
  addEventListener('scroll',()=>{if(t)return;t=true;requestAnimationFrame(()=>{const y=scrollY;if(y>last+6&&y>120)w.classList.add('hide');else if(y<last-6||y<=120)w.classList.remove('hide');last=y;t=false})},{passive:true});
})();

loadData(false);
</script>
