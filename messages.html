<style>
:root{--red:#f37b1d;--red-light:#ffa74f;--red-deep:#cc5a00;--gold:#ffcc00;--navy:#3d2b1f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.4;background:#fcfaf8;color:#222;width:100%;min-height:100vh;position:relative;padding-bottom:84px;overflow-x:hidden}
img,svg{max-width:100%}
.i3d{display:block;filter:drop-shadow(0 2px 2px rgba(120,60,0,.3))}
.back{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#fff}
.back svg{width:20px;height:20px}
.float-wrap{position:fixed;right:10px;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:90}
.float-gift img{display:block;width:48px;height:auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;padding:5px 0 calc(7px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600;color:#666;text-decoration:none;flex:1;max-width:100px}
.icon-wrapper{width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.nav-item svg{width:28px;height:28px;opacity:.85}
.nav-item.active{color:var(--red-deep);font-weight:800}
.nav-item.active .icon-wrapper{transform:translateY(-3px) scale(1.1)}
.nav-item.active svg{opacity:1}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(40,28,20,.92);color:#fff;padding:9px 16px;border-radius:30px;font-size:13px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86%;text-align:center}
.toast.show{opacity:1}

.float-app{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;}
.float-app img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
.float-app span{background:linear-gradient(160deg,var(--gold),var(--red));color:#fff;font-size:9px;font-weight:900;letter-spacing:1px;padding:1px 8px;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.page-header{position:relative;height:52px;background:linear-gradient(180deg,var(--red-light),var(--red));border-radius:0 0 20px 20px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(204,90,0,.25)}
.page-header h1{color:#fff;font-size:clamp(16px,4.6vw,19px);font-weight:800}

.content{max-width:820px;margin:0 auto;padding:10px 12px}
.day-row{display:flex;align-items:center;justify-content:space-between;margin:14px 2px 8px}
.day{display:flex;align-items:center;gap:9px;color:var(--red-deep);font-size:clamp(14px,4vw,16px);font-weight:800}
.day::before{content:"";width:7px;height:20px;border-radius:4px;background:linear-gradient(180deg,var(--red-light),var(--red-deep))}
.count{background:#ffe9d9;color:var(--red-deep);font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:20px}
.stripe{border-radius:20px;padding:5px;background:repeating-linear-gradient(135deg,var(--red) 0 10px,#ffe6d0 10px 20px);box-shadow:0 3px 10px rgba(243,123,29,.18);animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.stripe-in{background:#fff;border-radius:16px;padding:2px 12px}
.msg-item{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid #f4ece6}
.msg-item:last-child{border-bottom:none}
.av{width:34px;height:34px;border-radius:11px;background:linear-gradient(160deg,var(--red-light),var(--red-deep));display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 3px 8px rgba(204,90,0,.3)}
.av svg{width:18px;height:18px}
.msg-main{flex:1;min-width:0}
.msg-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.msg-title{color:var(--red-deep);font-size:clamp(13px,3.7vw,14.5px);font-weight:800;line-height:1.3}
.msg-time{color:#a39990;font-size:11.5px;font-weight:600;white-space:nowrap;padding-top:1px}
.msg-text{margin-top:5px;color:#5c534d;font-size:clamp(12.5px,3.5vw,13.5px);line-height:1.6;white-space:pre-wrap;word-wrap:break-word}
.msg-text.clamp{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.more{background:none;border:none;color:var(--red-deep);font-weight:800;font-size:12px;margin-top:4px;padding:2px 0;cursor:pointer;font-family:inherit}
.msg-img{display:block;width:100%;max-height:240px;object-fit:cover;border-radius:12px;margin:10px 0 2px}
.empty{text-align:center;color:#a39990;font-size:14px;margin:60px 0}
.empty svg{width:54px;height:54px;display:block;margin:0 auto 10px;color:#e0d2c6}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:700px){.content{padding:16px 20px}}
@media(max-height:500px){.nav-item{font-size:10px}.icon-wrapper{width:26px;height:26px}.nav-item svg{width:24px;height:24px}body{padding-bottom:64px}.float-wrap{bottom:64px}}

<!-- 1. LOAD THE BRAIN -->
<script src="splash.js"></script>

<script>
const fmtDate=s=>{const p=String(s).slice(0,10).split('-');return p[2]+'/'+p[1]+'/'+p[0]};
const group=(arr)=>{const g={};arr.forEach(x=>{(g[x.date]=g[x.date]||[]).push(x)});return Object.keys(g).sort().reverse().map(d=>({date:d,items:g[d]}))};

/* ===== CONFIG ===== */
const LOCAL_KEY = 'splash_messages';
const API_URL   = 'api/messages.php';
const USE_API   = false;            // Flip to true once api/messages.php exists
const POLL_MS   = 8000;             // Refresh every 8s (only while tab is visible)

const BELL='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 16V11A6 6 0 0 0 6 11V16L4 18H20ZM10 21H14"/></svg>';

function localMsgs(){
  try{const v=JSON.parse(localStorage.getItem(LOCAL_KEY));return Array.isArray(v)?v:[]}
  catch(e){return []}
}

async function remoteMsgs(){
  if (!USE_API) return [];
  try {
    const r = await fetch(API_URL, { cache: 'no-store' });
    if (!r.ok) return [];
    const j = await r.json();
    return Array.isArray(j) ? j : [];
  } catch (e) { return []; }
}

async function loadAll(){
  const remote = await remoteMsgs();
  const all = remote.concat(localMsgs());
  // Deduplicate and drop malformed entries
  const seen = new Set();
  return all.filter(m => {
    if (!m || !m.date || !m.title) return false;
    const k = m.id || (m.title + m.date + m.time);
    if (seen.has(k)) return false;
    seen.add(k);
    return true;
  });
}

function render(msgs){
  const list = document.getElementById('list');
  list.innerHTML = '';
  if (!msgs.length) {
    list.innerHTML = '<div class="empty"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M18 16V11A6 6 0 0 0 6 11V16L4 18H20ZM10 21H14"/></svg>No messages yet</div>';
    return;
  }
  group(msgs).forEach(g => {
    const row = document.createElement('div');
    row.className = 'day-row';
    row.innerHTML = '<div class="day"></div><div class="count"></div>';
    row.querySelector('.day').textContent = fmtDate(g.date);
    row.querySelector('.count').textContent = g.items.length + (g.items.length > 1 ? ' messages' : ' message');
    list.appendChild(row);

    const card = document.createElement('div'); card.className = 'stripe';
    const inner = document.createElement('div'); inner.className = 'stripe-in';

    g.items.sort((a, b) => String(b.time || '').localeCompare(String(a.time || ''))).forEach(m => {
      const it = document.createElement('div'); it.className = 'msg-item';
      const av = document.createElement('div'); av.className = 'av'; av.innerHTML = BELL;
      const main = document.createElement('div'); main.className = 'msg-main';
      const top = document.createElement('div'); top.className = 'msg-top';
      const t = document.createElement('div'); t.className = 'msg-title'; t.textContent = m.title || '';
      const tm = document.createElement('div'); tm.className = 'msg-time'; tm.textContent = m.time || '';
      top.append(t, tm); main.appendChild(top);

      const body = String(m.body || '');
      const b = document.createElement('div'); b.className = 'msg-text'; b.textContent = body; main.appendChild(b);

      if (body.length > 200 || body.split('\n').length > 5) {
        b.classList.add('clamp');
        const mb = document.createElement('button');
        mb.className = 'more';
        mb.textContent = 'Read more';
        mb.onclick = () => {
          const c = b.classList.toggle('clamp');
          mb.textContent = c ? 'Read more' : 'Show less';
        };
        main.appendChild(mb);
      }

      if (m.image) {
        const im = document.createElement('img');
        im.className = 'msg-img';
        im.src = m.image;
        im.alt = '';
        im.loading = 'lazy';
        main.appendChild(im);
      }

      it.append(av, main); inner.appendChild(it);
    });

    card.appendChild(inner); list.appendChild(card);
  });
}

/* ===== INIT + POLLING ===== */
let pollTimer = null;

async function refresh(){
  const msgs = await loadAll();
  render(msgs);
}

function startPolling(){
  stopPolling();
  pollTimer = setInterval(refresh, POLL_MS);
}
function stopPolling(){
  if (pollTimer) { clearInterval(pollTimer); pollTimer = null; }
}

document.addEventListener('DOMContentLoaded', () => {
  // Validate logged-in user (redirects blocked/deleted users)
  const me = Splash.requireUser();
  if (!me) return;

  refresh();
  startPolling();

  // Pause polling when tab is hidden; refresh + resume when tab is visible again
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      stopPolling();
    } else {
      refresh();
      startPolling();
    }
  });

  // When the admin sends a new message from another tab, refresh immediately
  window.addEventListener('storage', e => {
    if (e.key === LOCAL_KEY || e.key === null) refresh();
  });
});
</script>
