<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Splash VIP</title>
<style>
:root{--red:#f37b1d;--red-light:#ffa74f;--red-deep:#cc5a00;--gold:#ffcc00;--navy:#3d2b1f;--app-w:480px}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#fcfaf8;color:#222;max-width:var(--app-w);margin:0 auto;min-height:100dvh;position:relative;padding-bottom:calc(108px + env(safe-area-inset-bottom,0px));overflow-x:hidden;transition:max-width .3s;box-shadow:0 0 20px rgba(0,0,0,.05)}
img,svg,video{max-width:100%}
.i3d{display:block;filter:drop-shadow(0 3px 2px rgba(120,60,0,.35))}
.banner{position:relative;padding:10px}
.banner img,.banner video{width:100%;display:block;border-radius:20px;aspect-ratio:16/9;max-height:300px;object-fit:cover}
.banner video{position:absolute;top:10px;left:10px;width:calc(100% - 20px);height:calc(100% - 20px);opacity:0;transition:opacity .5s;pointer-events:none}
.banner video.show{opacity:1}
.actions{display:flex;background:#fff;padding:14px 4px 12px;margin:12px 10px 0;border-radius:20px;box-shadow:0 2px 10px rgba(0,0,0,.05)}
.action-item{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;min-width:0;font-size:clamp(12px,3vw,14px);font-weight:600;color:#444;text-decoration:none}
.action-icon svg{width:clamp(44px,13vw,54px);height:clamp(44px,13vw,54px);transition:transform .2s}
.action-item:active .action-icon{transform:translateY(2px) scale(.95)}
.notice{display:none;margin:12px 10px 0;padding:12px 14px;border-radius:14px;background:#fff3e0;color:var(--red-deep);font-size:13px;font-weight:700;line-height:1.4;text-align:center;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.notice.show{display:block}
.vip-section{padding:12px 10px 20px;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:14px}
.vip-card{display:flex;background:#fff;border-radius:12px;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);min-width:0}
.vip-limit{position:absolute;top:0;left:0;background:linear-gradient(90deg,var(--red-light),var(--red));color:#fff;font-size:12px;font-weight:700;padding:3px 12px;border-radius:12px 0 12px 0;z-index:10}
.product-img{width:42%;flex-shrink:0;display:flex;align-items:center;justify-content:center;padding:10px;border-right:1px solid #f4ece6;min-height:200px}
.product-img img{width:100%;height:100%;max-height:210px;object-fit:contain}
.vip-right{flex:1;min-width:0;display:flex;flex-direction:column;padding:12px;justify-content:center}
.vip-title{text-align:center;color:var(--red-deep);font-size:clamp(15px,2.5vw,17px);font-weight:800;margin-bottom:6px}
.vip-info{display:grid;grid-template-columns:1fr 1fr}
.info-item{text-align:center;padding:10px 2px;display:flex;flex-direction:column;justify-content:center;min-width:0}
.info-item:nth-child(odd){border-right:1px solid #f4ece6}
.info-item:nth-child(-n+2){border-bottom:1px solid #f4ece6}
.info-label{color:#887a72;font-size:clamp(11px,2vw,12px);margin-bottom:2px}
.info-value{color:var(--navy);font-size:clamp(11px,3vw,13px);font-weight:700;line-height:1.2;overflow-wrap:anywhere}
.buy-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin-top:14px;padding:11px 0;background:linear-gradient(180deg,var(--red-light),var(--red));color:#fff;border:none;border-radius:30px;font-size:clamp(13px,2.5vw,15px);font-weight:800;box-shadow:0 4px 10px rgba(243,123,29,.35);cursor:pointer;transition:transform .1s}
.buy-btn:active{transform:scale(.97)}
.buy-btn.coming-soon{background:#e0e0e0;color:#999;box-shadow:none;cursor:not-allowed}
.buy-btn.coming-soon:active{transform:none}
.float-wrap{position:fixed;right:max(8px,calc((100vw - var(--app-w))/2 + 8px));bottom:calc(122px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90;transition:right .3s,bottom .3s}
.float-gift img{width:clamp(48px,14vw,65px);height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.2))}
.float-app{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none}
.float-app img{width:clamp(42px,12vw,54px);height:clamp(42px,12vw,54px);object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.float-app span{background:linear-gradient(160deg,var(--gold),var(--red));color:#fff;font-size:11px;font-weight:900;letter-spacing:1px;padding:1px 10px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,.25)}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;max-width:var(--app-w);margin:0 auto;background:#fff;display:flex;justify-content:center;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:100;transition:max-width .3s}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:#666;text-decoration:none;flex:1;min-width:0;max-width:120px}
.icon-wrapper{width:48px;height:48px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.nav-item svg{width:44px;height:44px;opacity:.9}
.nav-item .i3d{filter:drop-shadow(0 1px 0 rgba(255,255,255,.8)) drop-shadow(0 5px 3px rgba(120,60,0,.5)) drop-shadow(0 9px 8px rgba(120,60,0,.22))}
.nav-item.active{color:var(--red-deep);font-weight:800}
.nav-item.active .icon-wrapper{transform:translateY(-6px) scale(1.15)}
.nav-item.active svg{opacity:1}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px;opacity:0;visibility:hidden;transition:opacity .3s;backdrop-filter:blur(3px)}
.modal-backdrop.show{opacity:1;visibility:visible}
.modal-box{background:#fff;border-radius:20px;width:100%;max-width:340px;padding:20px;box-shadow:0 10px 30px rgba(0,0,0,.2);transform:translateY(20px);transition:transform .3s cubic-bezier(.2,.8,.2,1);text-align:center}
.modal-backdrop.show .modal-box{transform:translateY(0)}
.modal-box h3{color:var(--red-deep);font-size:20px;margin-bottom:15px}
.modal-details{background:#fcfaf8;border-radius:12px;padding:15px;margin-bottom:20px;text-align:left}
.modal-details p{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px;color:#666}
.modal-details p:last-child{margin-bottom:0;border-top:1px dashed #ddd;padding-top:8px;margin-top:8px}
.modal-details p b{color:var(--red-deep);font-size:15px}
.modal-actions{display:flex;gap:10px}
.modal-actions button{flex:1;padding:12px;border-radius:25px;border:none;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit}
.btn-cancel{background:#eee;color:#666}
.btn-confirm{background:linear-gradient(180deg,var(--red-light),var(--red));color:#fff;box-shadow:0 4px 10px rgba(243,123,29,.3)}
.insufficient-box{padding:30px 24px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.icon-wrapper-error{width:60px;height:60px;background:#ffebee;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:20px}
.icon-wrapper-error svg{width:30px;height:30px;stroke:#e53935;stroke-width:2.5}
.insufficient-box p{color:#444;font-size:15px;line-height:1.5;font-weight:500}
.msg-text{font-size:14px;color:#555;line-height:1.5;margin-bottom:16px;white-space:pre-wrap}
.msg-img{max-width:100%;max-height:180px;border-radius:12px;margin-bottom:12px}
@media (max-width:360px){.actions,.vip-section{margin-left:8px;margin-right:8px}.vip-section{padding-left:8px;padding-right:8px}.vip-right{padding:10px 8px}.nav-item{font-size:11px}.nav-item svg{width:40px;height:40px}.icon-wrapper{width:44px;height:44px}}
@media (min-width:768px){:root{--app-w:720px}.banner img,.banner video{max-height:350px}.float-wrap{bottom:calc(140px + env(safe-area-inset-bottom,0px))}}
@media (min-width:1024px){:root{--app-w:980px}.banner img,.banner video{max-height:400px}.action-icon svg{width:64px;height:64px}}
@media (max-height:520px) and (orientation:landscape){body{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}.bottom-nav{padding-top:4px}.nav-item{flex-direction:row;justify-content:center;gap:6px;max-width:150px}.nav-item svg{width:32px;height:32px}.icon-wrapper{width:36px;height:36px}.float-wrap{bottom:calc(70px + env(safe-area-inset-bottom,0px))}.float-gift img{width:44px}.float-app img{width:36px;height:36px}.product-img{min-height:150px}}
</style>
</head>

      <p>Price: <b id="mPrice">-</b></p>
      <p>Daily Earning: <b id="mDaily">-</b></p>
      <p>Welcome Bonus: <b id="mBonus">-</b></p>
    </div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeBuyModal()">Cancel</button>
      <button class="btn-confirm" onclick="confirmBuy()">Confirm</button>
    </div>
  </div>
</div>

<div class="modal-backdrop" id="insufficientModal">
  <div class="modal-box insufficient-box">
    <div class="icon-wrapper-error" id="infoIcon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg></div>
    <p id="infoText">Insufficient balance, redirecting to deposit...</p>
  </div>
</div>

<script src="splash.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const read = (k, d) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? d; } catch (e) { return d; } };

const BASE = [
  {name:"Orange",img:"original",price:12000,daily:2200,days:30,limit:1},
  {name:"Mango",img:"sourcream",price:32000,daily:5840,days:40,limit:2},
  {name:"Pineapple",img:"cheddar",price:60000,daily:10000,days:50,limit:3},
  {name:"Mixed Fruit",img:"bbq",price:100000,daily:15000,days:60,limit:4},
  {name:"Apple",img:"saltvinegar",price:150000,daily:20000,days:70,limit:5},
  {name:"Grape",img:"spicy",price:220000,daily:25000,days:80,limit:6},
  {name:"Tropical",img:"paprika",price:300000,daily:30000,days:90,limit:7},
  {name:"Citrus",img:"ranch",price:400000,daily:40000,days:100,limit:8},
  {name:"Peach",img:"honey",price:550000,daily:50000,days:110,limit:9},
  {name:"Guava",img:"cheese",price:750000,daily:65000,days:120,limit:10}
];

function getPlans() {
  const a = read('splash_vip_plans', []);
  return BASE.map((p, i) => {
    const x = a[i] || {};
    const price = Number(x.price) || p.price, daily = Number(x.daily) || p.daily, days = Number(x.days) || p.days;
    return { ...p, price, daily, days, total: daily * days, available: a[i] ? !!x.available : i < 4 };
  });
}
function siteStatus() { const s = Splash.getStatus(); return { maintenance: s.maintenance, deposits: s.deposits }; }

const OK_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="#1fa84f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M8 12l3 3 5-6"></path></svg>';
const ERR_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>';

function owned() {
  const phone = localStorage.getItem('splash_current_user');
  const u = phone ? Splash.getUser(phone) : null, c = {};
  ((u && u.orders) || []).forEach(o => { c[o.planId] = (c[o.planId] || 0) + 1; });
  return c;
}

function renderPlans() {
  const st = siteStatus(), own = owned(), note = $('notice');
  if (st.maintenance) { note.textContent = 'The platform is under maintenance. Purchases are paused.'; note.classList.add('show'); }
  else note.classList.remove('show');

  $('vip').innerHTML = getPlans().map((p, i) => {
    const n = i + 1, have = own[n] || 0, maxed = have >= p.limit;
    const off = !p.available || st.maintenance || maxed;
    const label = st.maintenance ? 'Maintenance' : !p.available ? 'Coming Soon' : maxed ? 'Limit reached' : 'BUY';
    const action = off ? 'disabled' : `onclick="openBuyModal(${n})"`;
    return `<div class="vip-card">
      <div class="vip-limit">${have}/${p.limit}</div>
      <div class="product-img"><img src="pringles-${esc(p.img)}.png" alt="${esc(p.name)}" onerror="this.src='https://via.placeholder.com/150?text=Juice'"></div>
      <div class="vip-right">
        <div class="vip-title">Splash VIP-${n}</div>
        <div class="vip-info">
          <div class="info-item"><div class="info-label">Price</div><div class="info-value">${Splash.formatMoney(p.price)}</div></div>
          <div class="info-item"><div class="info-label">Daily</div><div class="info-value">${Splash.formatMoney(p.daily)}</div></div>
          <div class="info-item"><div class="info-label">Days</div><div class="info-value">${p.days}</div></div>
          <div class="info-item"><div class="info-label">Total</div><div class="info-value">${Splash.formatMoney(p.total)}</div></div>
        </div>
        <button class="buy-btn${off ? ' coming-soon' : ''}" ${action}>${label}</button>
      </div></div>`;
  }).join('');
}
renderPlans();

window.addEventListener('storage', e => { if (e.key && e.key.startsWith('splash_')) { renderPlans(); showMessages(); } });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { renderPlans(); showMessages(); } });

const vid = $('bannerVid');
const showImage = () => { vid.classList.remove('show'); vid.pause(); setTimeout(playVideo, 3000); };
const playVideo = () => { vid.currentTime = 0; vid.play().then(() => vid.classList.add('show')).catch(showImage); };
vid.addEventListener('ended', showImage);
window.addEventListener('load', () => { setTimeout(showImage, 1800); });

let selectedPlan = null;

function openBuyModal(id) {
  const p = getPlans()[id - 1];
  if (!p || !p.available || siteStatus().maintenance) return renderPlans();
  selectedPlan = { id, name: p.name, price: p.price, daily: p.daily };
  $('mName').textContent = `VIP-${id} (${p.name})`;
  $('mPrice').textContent = Splash.formatMoney(p.price);
  $('mDaily').textContent = Splash.formatMoney(p.daily);
  $('mBonus').textContent = Splash.formatMoney(Splash.welcomeBonus);
  $('buyModal').classList.add('show');
}
function closeBuyModal() { $('buyModal').classList.remove('show'); selectedPlan = null; }

function info(text, ok, then, ms) {
  const box = $('insufficientModal');
  $('infoText').textContent = text;
  $('infoIcon').innerHTML = ok ? OK_ICON : ERR_ICON;
  $('infoIcon').style.background = ok ? '#e6f7ec' : '#ffebee';
  box.classList.add('show');
  setTimeout(() => { if (then) then(); else box.classList.remove('show'); }, ms || 3500);
}

function confirmBuy() {
  if (!selectedPlan) return;
  const sp = selectedPlan;
  closeBuyModal();
  const phone = localStorage.getItem('splash_current_user');
  if (!phone) { window.location.href = 'index.html'; return; }
  const r = Splash.buyPlan(phone, { id: sp.id, name: sp.name, price: sp.price, daily: sp.daily, days: getPlans()[sp.id - 1].days, limit: BASE[sp.id - 1].limit });
  if (r.ok) return info('Purchase successful! Opening your orders...', true, () => { window.location.href = 'service.html'; }, 1800);
  if (r.insufficient) {
    const dep = Splash.depositsOpen();
    if (!dep.ok) return info(dep.message);
    return info('Insufficient balance, redirecting to deposit...', false, () => { window.location.href = 'deposit.html'; }, 4000);
  }
  info(r.message || 'Purchase failed.');
  renderPlans();
}

function showMessages() {
  if ($('msgModal')) return;
  const seen = read('splash_seen_msgs', []);
  const m = read('splash_messages', []).filter(x => !seen.includes(x.id)).pop();
  if (!m) return;
  const d = document.createElement('div');
  d.className = 'modal-backdrop show'; d.id = 'msgModal';
  d.innerHTML = `<div class="modal-box"><h3>${esc(m.title)}</h3>${m.image ? `<img class="msg-img" src="${esc(m.image)}" alt="">` : ''}<p class="msg-text">${esc(m.body)}</p><div class="modal-actions"><button class="btn-confirm" id="msgOk">Got it</button></div></div>`;
  document.body.appendChild(d);
  $('msgOk').onclick = () => {
    seen.push(m.id);
    try { localStorage.setItem('splash_seen_msgs', JSON.stringify(seen)); } catch (e) {}
    d.remove(); showMessages();
  };
}
showMessages();
</script>
</body>
  </html>
