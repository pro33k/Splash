<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Bank Cards - Splash</title>
<style>
:root{--red:#f37b1d;--red-light:#ffa74f;--red-deep:#cc5a00;--gold:#ffcc00;--navy:#3d2b1f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.4;background:#fcfaf8;color:#222;width:100%;min-height:100vh;position:relative;padding-bottom:84px;overflow-x:hidden}
img,svg{max-width:100%}
.i3d{display:block;filter:drop-shadow(0 2px 2px rgba(120,60,0,.3))}
.back{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#fff}
.back svg{width:20px;height:20px}
.float-wrap{position:fixed;right:10px;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:90}
.float-gift img{display:block;width:48px;height:auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;padding:5px 0 calc(7px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600;color:#666;text-decoration:none;flex:1;max-width:100px}
.icon-wrapper{width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.nav-item svg{width:28px;height:28px;opacity:.85}
.nav-item.active{color:var(--red-deep);font-weight:800}
.nav-item.active .icon-wrapper{transform:translateY(-3px) scale(1.1)}
.nav-item.active svg{opacity:1}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(40,28,20,.92);color:#fff;padding:9px 16px;border-radius:30px;font-size:13px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86%;text-align:center}
.toast.show{opacity:1}

.float-app{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;}
.float-app img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
.float-app span{background:linear-gradient(160deg,var(--gold),var(--red));color:#fff;font-size:9px;font-weight:900;letter-spacing:1px;padding:1px 8px;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.page-header{position:relative;height:52px;background:linear-gradient(180deg,var(--red-light),var(--red));border-radius:0 0 20px 20px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(204,90,0,.25)}
.page-header h1{color:#fff;font-size:clamp(16px,4.6vw,19px);font-weight:800}

main{display:grid;grid-template-columns:1fr;gap:14px;padding:14px 12px 0;align-items:start}
.sec{display:flex;align-items:center;justify-content:space-between;margin:0 2px 6px}
.sec .t{display:flex;align-items:center;gap:9px;color:var(--navy);font-size:clamp(15px,4.3vw,17px);font-weight:800}
.sec .t::before{content:"";width:7px;height:20px;border-radius:4px;background:linear-gradient(180deg,var(--red-light),var(--red-deep))}
.sec .n{background:#ffe9d9;color:var(--red-deep);font-size:12px;font-weight:800;padding:3px 10px;border-radius:20px}

/* ---- Card carousel ---- */
.cards{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.cards::-webkit-scrollbar{display:none}
.bcard{--bg:linear-gradient(135deg,#0b0b0b,#2a2a2a 55%,#5a5a5a);flex:0 0 min(100%,380px);aspect-ratio:1.586;scroll-snap-align:center;container-type:inline-size;border-radius:18px;padding:5.5% 6.5%;color:#fff;position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;background:var(--bg);box-shadow:0 12px 24px rgba(0,0,0,.25),inset 0 1px 0 rgba(255,255,255,.18);animation:pop .6s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0)*.09s);transition:transform .3s,box-shadow .3s}
.bcard:hover{transform:translateY(-4px) scale(1.01);box-shadow:0 18px 30px rgba(0,0,0,.3),inset 0 1px 0 rgba(255,255,255,.18)}
.bcard.active{border:2px solid #1fa84f;box-shadow:0 12px 24px rgba(31,168,79,.28),inset 0 1px 0 rgba(255,255,255,.18)}
.bcard::before{content:"";position:absolute;width:75%;aspect-ratio:1;right:-22%;top:-38%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 68%);pointer-events:none}
.bcard::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 38%,rgba(255,255,255,.2) 50%,transparent 62%);transform:translateX(-130%);animation:shine 5s ease-in-out infinite 1.2s;pointer-events:none}
.bcard.t1{--bg:linear-gradient(135deg,#ffa74f,#f37b1d 50%,#a84700)}
.bcard.t2{--bg:linear-gradient(135deg,#14274e,#27519c 60%,#4a7bd0)}
.bcard.t3{--bg:linear-gradient(135deg,#3d2b1f,#8a6a1c 55%,#d4a62a)}
.bcard.t4{--bg:linear-gradient(135deg,#0b4f4a,#128c84 55%,#27c4b8)}
.bcard.ghost{--bg:linear-gradient(135deg,#2b2b30,#4a4a52 55%,#7a7a84);animation:pop .6s cubic-bezier(.2,.8,.2,1) both,float 4s ease-in-out infinite .6s}
.c-top{display:flex;justify-content:space-between;align-items:center;gap:6px;position:relative;z-index:1}
.c-bank-wrap{display:flex;align-items:center;gap:6px;min-width:0;flex:1}
.c-bank{font-size:5.2cqw;font-size:clamp(13px,5.2cqw,22px);font-weight:800;letter-spacing:.3px;text-shadow:0 1px 3px rgba(0,0,0,.4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.active-badge{background:#1fa84f;color:#fff;font-size:8px;font-weight:800;padding:2px 6px;border-radius:8px;letter-spacing:.5px;flex-shrink:0;text-shadow:none}
.c-btns{display:flex;gap:5px;flex-shrink:0}
.rm{background:rgba(255,255,255,.18);border:none;color:#fff;border-radius:12px;padding:3px 9px;font-size:11px;font-weight:700;cursor:pointer;font-family:inherit;backdrop-filter:blur(4px);white-space:nowrap}
.rm:active{transform:scale(.94)}
.use-btn{background:rgba(31,168,79,.85)}
.use-btn:active{transform:scale(.94)}
.c-mid{display:flex;align-items:center;gap:10px;position:relative;z-index:1}
.chip{width:12cqw;width:clamp(36px,12cqw,52px);aspect-ratio:1.3;border-radius:7px;background:linear-gradient(135deg,#ffe9a0,#d8a928 55%,#f6d672);position:relative;box-shadow:inset 0 0 0 1px rgba(0,0,0,.2)}
.chip::before,.chip::after{content:"";position:absolute;background:rgba(0,0,0,.22)}
.chip::before{left:0;right:0;top:50%;height:1px}
.chip::after{top:0;bottom:0;left:36%;width:1px;box-shadow:14px 0 0 rgba(0,0,0,.22)}
.nfc{width:20px;height:20px;opacity:.85}
.c-num{font-family:'Courier New',monospace;font-size:6.4cqw;font-size:clamp(15px,6.4cqw,26px);font-weight:700;letter-spacing:.14em;text-shadow:0 2px 3px rgba(0,0,0,.45);cursor:pointer;user-select:none;position:relative;z-index:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-bot{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;position:relative;z-index:1}
.c-lbl{font-size:2.8cqw;font-size:clamp(8px,2.8cqw,11px);opacity:.7;letter-spacing:1px;text-transform:uppercase}
.c-hold{font-size:4.2cqw;font-size:clamp(11px,4.2cqw,17px);font-weight:700;letter-spacing:.6px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62cqw}
.net{display:flex;flex-shrink:0}
.net i{width:8cqw;width:clamp(24px,8cqw,34px);aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.85)}
.net i+i{margin-left:-35%;background:rgba(255,200,60,.9);mix-blend-mode:multiply}
.hint{text-align:center;color:#9a8f87;font-size:11.5px;margin-top:2px}

/* ---- Form ---- */
.panel{background:#faf5f0;border-radius:20px;padding:12px 14px 16px;box-shadow:0 3px 12px rgba(0,0,0,.04)}
.f-l{display:block;color:#6b5f57;font-size:13px;font-weight:800;margin:12px 3px 6px}
.f-in{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:0 13px;height:44px;box-shadow:0 0 0 1.5px #ffe3cc;transition:box-shadow .2s}
.f-in:focus-within{box-shadow:0 0 0 2px var(--red),0 4px 12px rgba(243,123,29,.2)}
.f-in input{flex:1;border:none;outline:none;background:transparent;font-size:14.5px;color:var(--navy);font-weight:600;height:100%;min-width:0;font-family:inherit}
.f-in input::placeholder{color:#8e857d;font-weight:600}
.f-in svg{width:22px;height:22px;flex-shrink:0}
.hash{color:var(--red-deep);font-size:18px;font-weight:800;width:22px;text-align:center}
.btn{width:100%;border:none;border-radius:30px;padding:12px;background:linear-gradient(180deg,var(--red-light),var(--red-deep));color:#fff;font-size:15px;font-weight:800;letter-spacing:.5px;box-shadow:0 5px 12px rgba(243,123,29,.4);cursor:pointer;font-family:inherit}
.btn:active{transform:scale(.98)}
.btn-row{margin-top:16px}

@keyframes pop{from{opacity:0;transform:translateY(18px) scale(.94)}to{opacity:1;transform:none}}
@keyframes shine{0%,55%{transform:translateX(-130%)}100%{transform:translateX(130%)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

@media(min-width:700px){
main{grid-template-columns:1.1fr 1fr;gap:20px;padding:18px 20px 0}
.bcard{flex-basis:min(100%,420px)}
}
@media(max-height:500px){.nav-item{font-size:10px}.icon-wrapper{width:26px;height:26px}.nav-item svg{width:24px;height:24px}body{padding-bottom:64px}.float-wrap{bottom:64px}}
</style>
</head>

<script>
function toast(t){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e)}e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}

const MAX=5;
const grp=s=>String(s).replace(/\s+/g,'').replace(/(.{4})/g,'$1 ').trim();
const mask=s=>{s=String(s).replace(/\s+/g,'');return grp('\u2022'.repeat(Math.max(s.length-4,0))+s.slice(-4));};
const NFC='<svg class="nfc" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round"><path d="M7 8C9 10.5 9 13.5 7 16M11 6C14 10 14 14 11 18M15 4C19.5 9.5 19.5 14.5 15 20"/></svg>';

let cards = [];
let users = [];
let userIndex = -1;

/* ========== INIT ========== */
document.addEventListener('DOMContentLoaded', () => {
  // 1. Validate user (redirects blocked/deleted users)
  const me = Splash.requireUser();
  if (!me) return;

  const currentPhone = localStorage.getItem('splash_current_user');
  users = JSON.parse(localStorage.getItem('splash_users')) || [];
  userIndex = users.findIndex(u => String(u.phone) === String(currentPhone));
  if (userIndex === -1) { window.location.href = 'index.html'; return; }

  // 2. Load cards (with one-time migration from the old single `bank` field)
  if (Array.isArray(users[userIndex].bankCards)) {
    cards = users[userIndex].bankCards;
  } else if (users[userIndex].bank) {
    cards = [{
      id: Date.now(),
      bank: users[userIndex].bank.bank,
      account: users[userIndex].bank.account,
      holder: users[userIndex].bank.name,
      phone: users[userIndex].bank.phone || null
    }];
    users[userIndex].bankCards = cards;
    localStorage.setItem('splash_users', JSON.stringify(users));
  }

  render();

  // 3. Live refresh from admin
  window.addEventListener('storage', e => {
    if (e.key === 'splash_users') {
      users = JSON.parse(localStorage.getItem('splash_users')) || [];
      userIndex = users.findIndex(u => String(u.phone) === String(localStorage.getItem('splash_current_user')));
      if (userIndex === -1) { window.location.href = 'index.html'; return; }
      cards = users[userIndex].bankCards || [];
      render();
    }
  });
});

/* ========== RENDER ========== */
function render(){
  const box = document.getElementById('cards');
  box.innerHTML = '';
  document.getElementById('cnt').textContent = cards.length + '/' + MAX;
  document.getElementById('hint').style.display = cards.length ? '' : 'none';

  if (!cards.length) {
    const g = document.createElement('div');
    g.className = 'bcard ghost';
    g.innerHTML = `<div class="c-top"><div class="c-bank-wrap"><div class="c-bank"></div></div></div>
      <div class="c-mid"><div class="chip"></div>${NFC}</div>
      <div class="c-num"></div>
      <div class="c-bot"><div><div class="c-lbl">Cardholder</div><div class="c-hold"></div></div>
      <div class="net"><i></i><i></i></div></div>`;
    box.appendChild(g);
    preview();
    return;
  }

  const activeAccount = users[userIndex].bank ? String(users[userIndex].bank.account) : null;

  cards.forEach((c, i) => {
    const isActive = activeAccount && String(c.account) === activeAccount;
    const d = document.createElement('div');
    d.className = 'bcard t' + (i % 5) + (isActive ? ' active' : '');
    d.style.setProperty('--i', i);

    const useBtn = isActive ? '' : `<button class="rm use-btn" data-act="use">Use</button>`;

    d.innerHTML = `<div class="c-top">
        <div class="c-bank-wrap">
          <div class="c-bank"></div>
          ${isActive ? '<span class="active-badge">ACTIVE</span>' : ''}
        </div>
        <div class="c-btns">
          ${useBtn}
          <button class="rm" data-act="remove">Remove</button>
        </div>
      </div>
      <div class="c-mid"><div class="chip"></div>${NFC}</div>
      <div class="c-num"></div>
      <div class="c-bot">
        <div><div class="c-lbl">Cardholder</div><div class="c-hold"></div></div>
        <div class="net"><i></i><i></i></div>
      </div>`;

    d.querySelector('.c-bank').textContent = c.bank;
    const n = d.querySelector('.c-num');
    let shown = false;
    n.textContent = mask(c.account);
    n.onclick = () => { shown = !shown; n.textContent = shown ? grp(c.account) : mask(c.account); };
    d.querySelector('.c-hold').textContent = c.holder;

    const use = d.querySelector('[data-act="use"]');
    if (use) use.onclick = () => setActive(c);

    d.querySelector('[data-act="remove"]').onclick = () => removeCard(c);

    box.appendChild(d);
  });
}

/* ========== PREVIEW (ghost card when list is empty) ========== */
function preview(){
  const g = document.querySelector('.bcard.ghost');
  if (!g) return;
  g.querySelector('.c-bank').textContent = document.getElementById('bank').value.trim() || 'Bank Name';
  const a = document.getElementById('acc').value.replace(/\s+/g,'');
  g.querySelector('.c-num').textContent = a ? grp(a) : '\u2022\u2022\u2022\u2022 \u2022\u2022\u2022\u2022 \u2022\u2022\u2022\u2022 \u2022\u2022\u2022\u2022';
  g.querySelector('.c-hold').textContent = document.getElementById('holder').value.trim() || 'Your Name';
}

['bank','acc','holder'].forEach(id => document.getElementById(id).addEventListener('input', preview));

/* ========== SAVE NEW CARD ========== */
function saveCard(){
  const b = document.getElementById('bank').value.trim();
  const a = document.getElementById('acc').value.replace(/\s+/g,'');
  const h = document.getElementById('holder').value.trim();
  const p = document.getElementById('cardPhone').value.trim();

  if (!b || !a || !h) return toast('Please fill in all fields');
  if (!/^\d{6,20}$/.test(a)) return toast('Enter a valid account number');
  if (cards.length >= MAX) return toast('You can add up to ' + MAX + ' cards');

  const newCard = { id: Date.now(), bank: b, account: a, holder: h, phone: p || null };
  cards.push(newCard);
  users[userIndex].bankCards = cards;

  // Newly-added card becomes the active one (matches previous behavior)
  users[userIndex].bank = {
    name: h,
    phone: p || users[userIndex].phone,
    bank: b,
    account: a
  };

  localStorage.setItem('splash_users', JSON.stringify(users));
  ['bank','acc','holder','cardPhone'].forEach(id => document.getElementById(id).value = '');
  render();
  toast('Card saved & set as active');
}

/* ========== SWITCH ACTIVE CARD ========== */
function setActive(c){
  users[userIndex].bank = {
    name: c.holder,
    phone: c.phone || users[userIndex].phone,
    bank: c.bank,
    account: c.account
  };
  localStorage.setItem('splash_users', JSON.stringify(users));
  render();
  toast(c.bank + ' is now your active card');
}

/* ========== REMOVE CARD ========== */
function removeCard(c){
  if (!confirm('Remove this card?')) return;

  const wasActive = users[userIndex].bank && String(users[userIndex].bank.account) === String(c.account);

  // Remove from array
  cards = cards.filter(x => x.id !== c.id);
  users[userIndex].bankCards = cards;

  // If it was the active card, promote the next one (or clear)
  if (wasActive) {
    users[userIndex].bank = cards.length > 0 ? {
      name: cards[0].holder,
      phone: cards[0].phone || users[userIndex].phone,
      bank: cards[0].bank,
      account: cards[0].account
    } : null;
  }

  localStorage.setItem('splash_users', JSON.stringify(users));
  render();
  toast('Card removed');
}
</script>
</body>
</html>
