<style>
:root{--red:#f37b1d;--red-light:#ffa74f;--red-deep:#cc5a00;--gold:#ffcc00;--navy:#3d2b1f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:14px;line-height:1.4;background:#fcfaf8;color:#222;width:100%;min-height:100vh;position:relative;padding-bottom:84px;overflow-x:hidden}
img,svg{max-width:100%}
.i3d{display:block;filter:drop-shadow(0 2px 2px rgba(120,60,0,.3))}
.back{position:absolute;left:10px;top:50%;transform:translateY(-50%);width:34px;height:34px;display:flex;align-items:center;justify-content:center;color:#fff}
.back svg{width:20px;height:20px}
.float-wrap{position:fixed;right:10px;bottom:84px;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:90}
.float-gift img{display:block;width:48px;height:auto;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;padding:5px 0 calc(7px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:10.5px;font-weight:600;color:#666;text-decoration:none;flex:1;max-width:100px}
.icon-wrapper{width:32px;height:32px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.nav-item svg{width:28px;height:28px;opacity:.85}
.nav-item.active{color:var(--red-deep);font-weight:800}
.nav-item.active .icon-wrapper{transform:translateY(-3px) scale(1.1)}
.nav-item.active svg{opacity:1}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:rgba(40,28,20,.92);color:#fff;padding:9px 16px;border-radius:30px;font-size:13px;font-weight:600;z-index:999;opacity:0;pointer-events:none;transition:opacity .25s;max-width:86%;text-align:center}
.toast.show{opacity:1}

.float-app{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;}
.float-app img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 3px 5px rgba(0,0,0,.25))}
.float-app span{background:linear-gradient(160deg,var(--gold),var(--red));color:#fff;font-size:9px;font-weight:900;letter-spacing:1px;padding:1px 8px;border-radius:10px;box-shadow:0 2px 4px rgba(0,0,0,.25)}
.page-header{position:relative;height:52px;background:linear-gradient(180deg,var(--red-light),var(--red));border-radius:0 0 20px 20px;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 10px rgba(204,90,0,.25)}
.page-header h1{color:#fff;font-size:clamp(15px,4.4vw,18px);font-weight:800;padding:0 48px;text-align:center}

main{display:grid;grid-template-columns:1fr;gap:12px;padding:14px 12px 0;max-width:960px;margin:0 auto;align-items:start}
.lock{width:62px;height:62px;border-radius:20px;margin:2px auto 0;background:linear-gradient(160deg,var(--red-light),var(--red-deep));display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px rgba(204,90,0,.3);animation:pop .6s cubic-bezier(.2,.8,.2,1) both,float 4s ease-in-out infinite .6s}
.lock svg{width:32px;height:32px}

.sub{text-align:center;color:#8e857d;font-size:12.5px;margin-top:2px}

.f-l{display:block;color:#6b5f57;font-size:13px;font-weight:800;margin:12px 3px 6px}

.f-in:focus-within{box-shadow:0 0 0 2px var(--red),0 4px 12px rgba(243,123,29,.2)}
.f-in>svg{width:20px;height:20px;flex-shrink:0;color:var(--red-deep)}

.eye svg{width:20px;height:20px}
.eye.on{color:var(--red-deep)}
.meter{display:flex;gap:5px;margin:8px 3px 0}

.tips .t::before{content:"";width:7px;height:20px;border-radius:4px;background:linear-gradient(180deg,var(--red-light),var(--red-deep))}
.rq{display:flex;align-items:center;gap:10px;padding:8px 0;font-size:13px;color:#857a72;font-weight:600;border-bottom:1.5px dashed #ffe6c4;transition:color .25s}
.rq:last-child{border-bottom:none}
.rq b{width:20px;height:20px;border-radius:50%;background:#ecdfd3;color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;transition:background .25s,transform .25s}
.rq.ok{color:#1b8a42}
.rq.ok b{background:#1fa84f;transform:scale(1.1)}
.shake{animation:shake .4s}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.96)}to{opacity:1;transform:none}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes shake{0%,100%{transform:none}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:700px){main{grid-template-columns:1.2fr 1fr;gap:18px;padding:20px 20px 0}}

<script src="splash.js"></script>

<script>
function toast(t){let e=document.getElementById('toast');if(!e){e=document.createElement('div');e.id='toast';e.className='toast';document.body.appendChild(e)}e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),2600)}

function tog(b){const i=b.parentElement.querySelector('input');const s=i.type==='password';i.type=s?'text':'password';b.classList.toggle('on',s);}

/* ========== PIN STRENGTH ========== */
function pinScore(p){
  if (!/^\d{6}$/.test(p)) return 0;
  const allSame = /^(\d)\1{5}$/.test(p);
  const seqUp   = ['012345','123456','234567','345678','456789'].includes(p);
  const seqDown = ['987654','876543','765432','654321','543210'].includes(p);
  if (allSame || seqUp || seqDown) return 1;
  const unique = new Set(p.split('')).size;
  if (unique <= 3) return 2;
  if (unique <= 4) return 3;
  return 4;
}

function check(){
  const o = document.getElementById('old').value.trim();
  const n = document.getElementById('nw').value.trim();
  const c = document.getElementById('cf').value.trim();

  const isSix = /^\d{6}$/.test(n);
  const allSame = /^(\d)\1{5}$/.test(n);
  const seqUp   = ['012345','123456','234567','345678','456789'].includes(n);
  const seqDown = ['987654','876543','765432','654321','543210'].includes(n);
  const obvious = allSame || seqUp || seqDown;

  const set = (id, ok) => document.getElementById(id).classList.toggle('ok', !!ok);
  set('r1', isSix);
  set('r2', n && o && n !== o);
  set('r3', n && n === c);
  set('r4', isSix && !obvious);

  const s = pinScore(n);
  const col = ['#ecdfd3','#e5484d','#f5a524','#7cc243','#1fa84f'][s];
  document.querySelectorAll('#meter i').forEach((b, i) => b.style.background = i < s ? col : '#ecdfd3');
  const labels = ['','Weak','Fair','Good','Strong'];
  document.getElementById('mtxt').textContent = n ? (s ? labels[s] : 'Must be 6 digits') : '';
  document.getElementById('mtxt').style.color = n ? col : '';
}

['old','nw','cf'].forEach(id => document.getElementById(id).addEventListener('input', check));

function bad(m){toast(m);const p=document.querySelector('.panel');p.classList.remove('shake');void p.offsetWidth;p.classList.add('shake');}

/* ========== SUBMIT ========== */
function submitPw(){
  const o = document.getElementById('old').value.trim();
  const n = document.getElementById('nw').value.trim();
  const c = document.getElementById('cf').value.trim();

  if (!o || !n || !c) return bad('Please fill in all fields');
  if (!/^\d{6}$/.test(n)) return bad('New trade password must be exactly 6 digits');
  if (n !== c) return bad('Passwords do not match');
  if (n === o) return bad('New password must be different from old');

  // 1. Validate user session
  const me = Splash.requireUser();
  if (!me) return;

  const phone = localStorage.getItem('splash_current_user');
  const users = JSON.parse(localStorage.getItem('splash_users')) || [];
  const idx = users.findIndex(u => String(u.phone) === String(phone));
  if (idx === -1) return bad('User session not found. Please log in again.');

  // 2. Handle accounts created before trade PINs existed
  if (!users[idx].tradePin) {
    return bad('No trade password set on this account. Please contact support to set one.');
  }

  // 3. Compare old PIN (trimmed on both sides — matches registration behavior)
  if (String(users[idx].tradePin) !== o) {
    return bad('Incorrect old trade password');
  }

  const go = document.getElementById('go');
  go.disabled = true;
  go.textContent = 'Updating...';

  setTimeout(() => {
    users[idx].tradePin = n;
    localStorage.setItem('splash_users', JSON.stringify(users));

    go.disabled = false;
    go.textContent = 'Change Trade Password';
    toast('Trade password changed successfully');

    document.getElementById('old').value = '';
    document.getElementById('nw').value = '';
    document.getElementById('cf').value = '';
    check();

    setTimeout(() => location.href = 'my.html', 1400);
  }, 800);
}

// Init
document.addEventListener('DOMContentLoaded', () => {
  const me = Splash.requireUser();
  if (!me) return;
  check();
});
</script>
