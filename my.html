<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="color-scheme" content="light only" />
<meta name="theme-color" content="#f37b1d" />
<title>My - Splash</title>
<style>
:root{color-scheme:light;--red:#f37b1d;--red-light:#ffa74f;--red-deep:#cc5a00;--gold:#ffcc00;--navy:#3d2b1f}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;color-scheme:light}
body{font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;background:#fcfaf8;color:#222;width:100%;min-height:100vh;position:relative;padding-bottom:95px;overflow-x:hidden;-webkit-text-fill-color:currentColor}
img,svg{max-width:100%}
.i3d{display:block;filter:drop-shadow(0 3px 2px rgba(120,60,0,.35))}

.wrap{display:block;width:100%}
.right{min-width:0}

/* --- PROFILE HERO --- */
.hero{position:relative;margin:12px 14px 40px;height:190px;border-radius:20px;background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.08);overflow:hidden}
.hero-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,0) 50%);z-index:2}
.user-row{position:absolute;z-index:3;top:20px;left:15px;right:15px;display:flex;align-items:center;gap:12px}
.avatar{width:55px;height:55px;border-radius:14px;background:#fff;border:2px solid #fff;overflow:hidden;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 8px rgba(0,0,0,.2);flex-shrink:0}
.avatar img{width:100%;height:100%;object-fit:cover}
.avatar svg{width:100%;height:100%}
.phone{color:#fff;font-size:clamp(16px,3vw,20px);font-weight:800;text-shadow:0 2px 4px rgba(0,0,0,.6);min-width:0;overflow:hidden;text-overflow:ellipsis}
.vip-badge{background:rgba(255,204,0,.9);color:#8a3b00;font-weight:800;font-size:clamp(10px,2vw,12px);padding:3px 8px;border-radius:20px;box-shadow:0 2px 4px rgba(0,0,0,.2);white-space:nowrap}
.bal-card{position:absolute;z-index:4;left:15px;right:15px;bottom:10px;background:#fff;border-radius:16px;display:flex;padding:14px 0;box-shadow:0 6px 15px rgba(0,0,0,.08)}
.bal-col{flex:1;min-width:0;text-align:center;padding:0 6px}
.bal-col+.bal-col{border-left:1px solid #f4ece6}
.bal-label{color:#887a72;font-size:clamp(12px,2vw,14px);font-weight:600}
.bal-value{color:var(--red-deep);font-size:clamp(15px,3vw,18px);font-weight:800;margin-top:4px;overflow:hidden;text-overflow:ellipsis}

/* --- MENU --- */
.menu{background:#fff;border-radius:20px;margin:0 14px;padding:4px 16px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.menu-item{display:flex;align-items:center;gap:14px;padding:14px 0;text-decoration:none;border-bottom:1px solid #f4ece6;transition:background .15s}
.menu-item:last-child{border-bottom:none}
.menu-item:active{background:#fcfaf8}
.m-ico svg{width:28px;height:28px}
.m-ico img{width:28px;height:28px;object-fit:contain;display:block;filter:drop-shadow(0 3px 2px rgba(120,60,0,.35))}
.m-label{flex:1;color:var(--navy);font-size:clamp(14px,2.5vw,16px);font-weight:700}
.chev{width:16px;height:16px;color:#c4b8af;flex-shrink:0}
.logout{display:block;width:calc(100% - 28px);margin:20px 14px 0;padding:clamp(12px,2vw,16px);border:none;border-radius:40px;background:linear-gradient(180deg,var(--red-light),var(--red-deep));color:#fff;font-size:clamp(14px,2.5vw,16px);font-weight:800;box-shadow:0 5px 12px rgba(243,123,29,.4);cursor:pointer;font-family:inherit;transition:transform .1s}
.logout:active{transform:scale(.97)}

/* floating graphics */
.float-wrap{position:fixed;right:10px;bottom:110px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:90}
.float-gift img{display:block;width:65px;height:auto;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.float-app{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;}
.float-app img{width:54px;height:54px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.float-app span{background:linear-gradient(160deg,var(--gold),var(--red));color:#fff;font-size:11px;font-weight:900;letter-spacing:1px;padding:1px 10px;border-radius:10px;box-shadow:0 2px 5px rgba(0,0,0,.25)}

/* bottom nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:#fff;display:flex;justify-content:center;padding:8px 0 calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -2px 10px rgba(0,0,0,.08);z-index:100}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:#666;text-decoration:none;flex:1;max-width:120px}
.icon-wrapper{width:42px;height:42px;display:flex;align-items:center;justify-content:center;transition:transform .2s}
.nav-item svg{width:38px;height:38px;opacity:.85}
.nav-item .i3d{filter:drop-shadow(0 1px 0 rgba(255,255,255,.8)) drop-shadow(0 5px 3px rgba(120,60,0,.5)) drop-shadow(0 9px 8px rgba(120,60,0,.22))}
.nav-item.active{color:var(--red-deep);font-weight:800}
.nav-item.active .icon-wrapper{transform:translateY(-4px) scale(1.15)}
.nav-item.active svg{opacity:1}

/* =========================================
   CUSTOM LOGOUT MODAL STYLES
   ========================================= */
.modal-backdrop {
  position: fixed; inset: 0; background: rgba(0, 0, 0, 0.6);
  z-index: 1000; display: flex; align-items: center; justify-content: center;
  padding: 20px; opacity: 0; visibility: hidden; transition: opacity 0.3s ease;
  backdrop-filter: blur(3px);
}
.modal-backdrop.show { opacity: 1; visibility: visible; }
.modal-box {
  background: #fff; border-radius: 20px; width: 100%; max-width: 320px;
  padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
  transform: translateY(20px); transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
  text-align: center;
}
.modal-backdrop.show .modal-box { transform: translateY(0); }
.modal-icon {
  width: 60px; height: 60px; background: #fff5ee; border-radius: 50%;
  display: flex; align-items: center; justify-content: center; margin: 0 auto 15px;
}
.modal-icon svg { width: 30px; height: 30px; stroke: var(--red); }
.modal-box h3 { color: var(--red-deep); font-size: 20px; margin-bottom: 10px; }
.modal-box p { color: #666; font-size: 14px; margin-bottom: 24px; line-height: 1.4; }
.modal-actions { display: flex; gap: 10px; }
.modal-actions button { flex: 1; padding: 12px; border-radius: 25px; border: none; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; }
.btn-cancel { background: #eee; color: #666; }
.btn-logout { background: linear-gradient(180deg, var(--red-light), var(--red)); color: #fff; box-shadow: 0 4px 10px rgba(243,123,29,0.3); }

/* =============== RESPONSIVE =============== */
@media(max-width:360px){.menu{padding:2px 12px}.m-label{font-size:14px}.hero{margin-left:10px;margin-right:10px}.menu{margin:0 10px}.logout{width:calc(100% - 20px);margin-left:10px;margin-right:10px}}
@media(min-width:600px){
  .hero{height:240px;margin-bottom:50px}
  .avatar{width:65px;height:65px}
  .bal-card{padding:18px 0}
  .menu{padding:8px 24px}
  .menu-item{padding:16px 0}
  .m-ico svg,.m-ico img{width:32px;height:32px}
}
@media(min-width:760px){
  .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:20px;max-width:1240px;margin:0 auto;padding:14px 20px;align-items:start}
  .hero{margin:0;position:sticky;top:14px}
  .menu{margin:0}
  .logout{width:100%;margin:16px 0 0}
  .float-wrap{bottom:120px}
}
@media(min-width:1100px){
  .hero{height:300px}
  .avatar{width:75px;height:75px}
  .bal-label{font-size:15px}.bal-value{font-size:20px}
}
@media(max-height:520px) and (orientation:landscape){
  .hero{height:200px;position:relative;top:0}
  .float-wrap{bottom:84px}
  .float-gift img{width:48px}.float-app img{width:40px;height:40px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<!-- ================= CUSTOM LOGOUT MODAL ================= -->
<div class="modal-backdrop" id="logoutModal" onclick="if(event.target===this)closeLogoutModal()">
  <div class="modal-box">
    <div class="modal-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
    </div>
    <h3>Logout</h3>
    <p>Are you sure you want to log out of your Splash account?</p>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="closeLogoutModal()">Cancel</button>
      <button class="btn-logout" onclick="confirmLogout()">Logout</button>
    </div>
  </div>
</div>

<script src="splash.js"></script>

<script>
function watchAdmin(fn){
  let t;
  const run=()=>{clearTimeout(t);t=setTimeout(fn,60)};
  addEventListener('storage',e=>{if(e.key===null||String(e.key).indexOf('splash_')===0)run()});
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)run()});
  setInterval(()=>{if(!document.hidden)fn()},3000);
}

function paint(){
  const me = Splash.requireUser();
  if (!me) return;
  try { Splash.settleOrders(me.phone); } catch (e) {}
  const u = Splash.getUser(me.phone);
  if (!u) return;
  document.getElementById('phone').textContent = u.phone;
  document.getElementById('balance').textContent = Splash.formatMoney(u.balance);
  document.getElementById('income').textContent = Splash.formatMoney(u.totalIncome);
  document.getElementById('vip').textContent = 'VIP ' + (Number(u.vipLevel) || 0);
}

document.addEventListener('DOMContentLoaded', () => {
  paint();
  watchAdmin(paint);
});

function openLogoutModal() { document.getElementById('logoutModal').classList.add('show'); }
function closeLogoutModal() { document.getElementById('logoutModal').classList.remove('show'); }
function confirmLogout() {
  closeLogoutModal();
  localStorage.removeItem('splash_current_user');
  window.location.href = 'index.html';
}
</script>
</body>
</html>
